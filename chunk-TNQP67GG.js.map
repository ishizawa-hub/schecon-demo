<div class="community-sub-create-page">
  <!-- 上部固定ヘッダー -->
  <header class="community-sub-create-page__header">
    <button class="community-sub-create-page__back" (click)="onBack()" aria-label="戻る">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2 class="community-sub-create-page__title">{{ title }}</h2>
  </header>

  <div class="community-sub-create-page__body">
    <!-- 募集 -->
    <ng-container *ngIf="subType === 'recruitment'">
      <app-recruitment-create [communityIdInput]="communityId"></app-recruitment-create>
    </ng-container>
    <!-- イベント -->
    <ng-container *ngIf="subType === 'event'">
      <app-event-create [communityIdInput]="communityId"></app-event-create>
    </ng-container>
    <!-- スレッド -->
    <ng-container *ngIf="subType === 'thread'">
      <app-thread-create [communityIdInput]="communityId"></app-thread-create>
    </ng-container>
    <!-- アピール -->
    <ng-container *ngIf="subType === 'appeal'">
      <app-appeal-create [communityIdInput]="communityId"></app-appeal-create>
    </ng-container>

    <!-- 未対応 subType -->
    <div class="community-sub-create-page__placeholder" *ngIf="!isSupported()">
      <mat-icon>construction</mat-icon>
      <p>このページは現在準備中です。<br />一覧画面のモーダルからご利用ください。</p>
      <button class="community-sub-create-page__back-btn" (click)="onBack()">戻る</button>
    </div>
  </div>
</div>
