<!-- STEP 9: KeyboardManager 適用 -->
<div class="appeal-create" [style.padding-bottom.px]="keyboardHeight">
  <h2 class="appeal-create__title">{{ isEdit ? 'アピールを編集' : '新規アピールを作成' }}</h2>

  <div class="appeal-create__form">
    <div class="appeal-create__field">
      <label class="appeal-create__label">タイトル <span class="appeal-create__required">*</span></label>
      <input
        class="appeal-create__input"
        type="text"
        [(ngModel)]="title"
        (ngModelChange)="onFieldChange()"
        placeholder="アピールタイトルを入力"
      />
    </div>

    <div class="appeal-create__field">
      <label class="appeal-create__label">自己紹介</label>
      <textarea
        class="appeal-create__textarea"
        [(ngModel)]="selfIntro"
        (ngModelChange)="onFieldChange()"
        placeholder="経歴やスキルの紹介を入力"
        rows="4"
      ></textarea>
    </div>

    <div class="appeal-create__field">
      <label class="appeal-create__label">スキル（カンマ区切り）</label>
      <input
        class="appeal-create__input"
        type="text"
        [(ngModel)]="skillsText"
        (ngModelChange)="onFieldChange()"
        placeholder="例: Python, 機械学習, データ分析"
      />
    </div>

    <div class="appeal-create__field">
      <label class="appeal-create__label">こんな人と出会いたい</label>
      <textarea
        class="appeal-create__textarea"
        [(ngModel)]="wantToMeet"
        (ngModelChange)="onFieldChange()"
        placeholder="出会いたい人物像を入力"
        rows="3"
      ></textarea>
    </div>
  </div>

  <div class="appeal-create__field appeal-create__image-upload-section">
    <label class="appeal-create__label">画像を添付（最大5枚）</label>
    <div class="appeal-create__image-previews" *ngIf="imagePreviewUrls.length > 0">
      <div class="appeal-create__image-thumb" *ngFor="let url of imagePreviewUrls; let i = index">
        <img [src]="url" />
        <button type="button" class="appeal-create__image-remove" (click)="removeImage(i)">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
    <app-image-upload
      *ngIf="imagePreviewUrls.length < 5"
      [recommendedSize]="'800 x 600px (4:3)'"
      (imageSelected)="onImageSelected($event)"
    ></app-image-upload>
    <p class="appeal-create__image-hint">{{ imagePreviewUrls.length }}/5枚</p>
  </div>

  <div class="appeal-create__actions">
    <button class="appeal-create__cancel-btn" (click)="onCancel()">キャンセル</button>
    <button
      class="appeal-create__submit-btn"
      (click)="onCreate()"
      [disabled]="!title.trim()"
    >
      {{ isEdit ? '更新する' : '投稿する' }}
    </button>
  </div>
</div>
