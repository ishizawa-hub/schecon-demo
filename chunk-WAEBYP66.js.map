<!-- STEP 9: KeyboardManager 適用 - SP キーボード時の dialog 高さ補正 -->
<div class="thread-create" [style.padding-bottom.px]="keyboardHeight">
  <div class="thread-create__header">
    <h2 class="thread-create__heading">{{ isEdit ? 'スレッドを編集' : '新規スレッドを作成' }}</h2>
    <button class="thread-create__close" (click)="onCancel()">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <div class="thread-create__body">
    <div class="thread-create__field">
      <label class="thread-create__label">タイトル</label>
      <input
        type="text"
        class="thread-create__input"
        placeholder="スレッドのタイトルを入力..."
        [(ngModel)]="title" (ngModelChange)="onFieldChange()"
      />
    </div>

    <div class="thread-create__field">
      <label class="thread-create__label">内容</label>
      <textarea
        class="thread-create__textarea"
        placeholder="スレッドの内容を入力..."
        rows="6"
        [(ngModel)]="content" (ngModelChange)="onFieldChange()"
      ></textarea>
    </div>
  </div>

  <div class="thread-create__body">
    <div class="thread-create__field">
      <label class="thread-create__label">画像を添付（任意）</label>
      <app-image-upload
        recommendedSize="1200 x 630px (16:9)"
        (imageSelected)="onImageSelected($event)"
        (imageRemoved)="onImageRemoved()"
      ></app-image-upload>
    </div>
  </div>

  <div class="thread-create__footer">
    <button class="thread-create__cancel-btn" (click)="onCancel()">キャンセル</button>
    <button
      class="thread-create__submit-btn"
      [disabled]="!title.trim() || !content.trim()"
      (click)="onSubmit()"
    >
      {{ isEdit ? '更新する' : '投稿する' }}
    </button>
  </div>
</div>
