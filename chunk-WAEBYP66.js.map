<!-- STEP 9: KeyboardManager 適用 -->
<div class="recruitment-create" [style.padding-bottom.px]="keyboardHeight">
  <h2 class="recruitment-create__title">{{ isEdit ? '募集を編集' : '新規募集を作成' }}</h2>

  <div class="recruitment-create__form">
    <div class="recruitment-create__field">
      <label class="recruitment-create__label">タイトル <span class="recruitment-create__required">*</span></label>
      <input
        class="recruitment-create__input"
        type="text"
        [(ngModel)]="title" (ngModelChange)="onFieldChange()"
        placeholder="募集タイトルを入力"
      />
    </div>

    <div class="recruitment-create__field">
      <label class="recruitment-create__label">課題・背景</label>
      <textarea
        class="recruitment-create__textarea"
        [(ngModel)]="problem" (ngModelChange)="onFieldChange()"
        placeholder="解決したい課題や背景を入力"
        rows="3"
      ></textarea>
    </div>

    <div class="recruitment-create__field">
      <label class="recruitment-create__label">詳細</label>
      <textarea
        class="recruitment-create__textarea"
        [(ngModel)]="details" (ngModelChange)="onFieldChange()"
        placeholder="募集の詳細を入力"
        rows="4"
      ></textarea>
    </div>

    <div class="recruitment-create__field">
      <label class="recruitment-create__label">締切日</label>
      <input
        class="recruitment-create__input"
        type="date"
        [(ngModel)]="deadline" (ngModelChange)="onFieldChange()"
      />
    </div>

    <div class="recruitment-create__field recruitment-create__field--row">
      <label class="recruitment-create__toggle">
        <input type="checkbox" [(ngModel)]="hasCompensation" (ngModelChange)="onFieldChange()" />
        <span>報酬あり</span>
      </label>
    </div>

    <div class="recruitment-create__field" *ngIf="hasCompensation">
      <label class="recruitment-create__label">報酬の詳細</label>
      <input
        class="recruitment-create__input"
        type="text"
        [(ngModel)]="compensationDetails" (ngModelChange)="onFieldChange()"
        placeholder="例: 月額10-20万円"
      />
    </div>
  </div>

  <div class="recruitment-create__field recruitment-create__image-upload-section">
    <label class="recruitment-create__label">画像を添付（最大5枚）</label>
    <div class="recruitment-create__image-previews" *ngIf="imagePreviewUrls.length > 0">
      <div class="recruitment-create__image-thumb" *ngFor="let url of imagePreviewUrls; let i = index">
        <img [src]="url" />
        <button type="button" class="recruitment-create__image-remove" (click)="removeImage(i)">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>
    <app-image-upload
      *ngIf="imagePreviewUrls.length < 5"
      [recommendedSize]="'800 x 600px (4:3)'"
      (imageSelected)="onImageSelected($event)"
    ></app-image-upload>
    <p class="recruitment-create__image-hint">{{ imagePreviewUrls.length }}/5枚</p>
  </div>

  <div class="recruitment-create__actions">
    <button class="recruitment-create__cancel-btn" (click)="onCancel()">キャンセル</button>
    <button
      class="recruitment-create__submit-btn"
      (click)="onCreate()"
      [disabled]="!title.trim()"
    >
      {{ isEdit ? '更新する' : '投稿する' }}
    </button>
  </div>
</div>
