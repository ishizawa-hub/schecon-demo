<!-- STEP 9: KeyboardManager 適用 -->
<div class="event-create" [style.padding-bottom.px]="keyboardHeight">
  <h2 class="event-create__title">{{ isEdit ? 'イベントを編集' : 'イベントを作成' }}</h2>

  <div class="event-create__form">
    <div class="event-create__field">
      <label class="event-create__label">タイトル <span class="event-create__required">*</span></label>
      <input
        class="event-create__input"
        type="text"
        [(ngModel)]="title" (ngModelChange)="onFieldChange()"
        placeholder="イベントタイトルを入力"
      />
    </div>

    <div class="event-create__field">
      <label class="event-create__label">説明</label>
      <textarea
        class="event-create__textarea"
        [(ngModel)]="description" (ngModelChange)="onFieldChange()"
        placeholder="イベントの説明を入力"
        rows="4"
      ></textarea>
    </div>

    <div class="event-create__field">
      <label class="event-create__label">開催日時</label>
      <input
        class="event-create__input"
        type="datetime-local"
        [(ngModel)]="date" (ngModelChange)="onFieldChange()"
      />
    </div>

    <div class="event-create__field">
      <label class="event-create__label">終了日時（任意）</label>
      <input
        class="event-create__input"
        type="datetime-local"
        [(ngModel)]="endDate" (ngModelChange)="onFieldChange()"
      />
    </div>

    <div class="event-create__field">
      <label class="event-create__label">場所</label>
      <input
        class="event-create__input"
        type="text"
        [(ngModel)]="location" (ngModelChange)="onFieldChange()"
        placeholder="開催場所を入力"
      />
    </div>

    <div class="event-create__field event-create__field--row">
      <label class="event-create__toggle">
        <input type="checkbox" [(ngModel)]="isOnline" (ngModelChange)="onFieldChange()" />
        <span>オンライン開催</span>
      </label>
    </div>

    <div class="event-create__field" *ngIf="isOnline">
      <label class="event-create__label">ミーティングURL</label>
      <input
        class="event-create__input"
        type="url"
        [(ngModel)]="meetingUrl" (ngModelChange)="onFieldChange()"
        placeholder="https://zoom.us/j/..."
      />
    </div>

    <div class="event-create__field">
      <label class="event-create__label">最大参加人数（任意）</label>
      <input
        class="event-create__input"
        type="number"
        [(ngModel)]="maxParticipants" (ngModelChange)="onFieldChange()"
        placeholder="未設定の場合は上限なし"
        min="1"
      />
    </div>

    <div class="event-create__field">
      <label class="event-create__label">タグ（カンマ区切り）</label>
      <input
        class="event-create__input"
        type="text"
        [(ngModel)]="tagsInput" (ngModelChange)="onFieldChange()"
        placeholder="例: React, TypeScript, 勉強会"
      />
    </div>

    <div class="event-create__field">
      <label class="event-create__label">画像を追加（任意）</label>
      <input
        class="event-create__input"
        type="url"
        [(ngModel)]="imageUrl" (ngModelChange)="onFieldChange()"
        placeholder="画像URLを入力"
      />
      <div class="event-create__image-preview" *ngIf="imageUrl">
        <img [src]="imageUrl" alt="プレビュー" />
      </div>
      <div class="event-create__image-info">
        推奨サイズ: 1200 x 630px / 対応形式: JPG, PNG, GIF, WebP / 最大5MB
      </div>
    </div>
  </div>

  <div class="event-create__actions">
    <button class="event-create__cancel-btn" (click)="onCancel()">キャンセル</button>
    <button
      class="event-create__submit-btn"
      (click)="onCreate()"
      [disabled]="!title.trim()"
    >
      {{ isEdit ? '更新する' : '作成する' }}
    </button>
  </div>
</div>
