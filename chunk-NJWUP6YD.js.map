<div
  class="avatar"
  [style.width.px]="size"
  [style.height.px]="size"
  [style.fontSize.px]="size * 0.4"
  [style.lineHeight.px]="size"
  [style.backgroundColor]="imageUrl ? 'transparent' : backgroundColor"
>
  <img *ngIf="imageUrl" [src]="imageUrl" [alt]="name" class="avatar__image" />
  <span *ngIf="!imageUrl" class="avatar__initials">{{ initials }}</span>
</div>
