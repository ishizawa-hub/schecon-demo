<div class="page-container">
  <nav class="back-nav">
    <button class="back-button" (click)="goBack()">
      <mat-icon>arrow_back</mat-icon>
      <span>戻る</span>
    </button>
  </nav>

  <!-- Success Banner -->
  <div class="success-banner">
    <mat-icon class="banner-icon">check_circle</mat-icon>
    <div class="banner-text">
      <strong>予定調整を作成しました。</strong>
      URLは期限まで何度も使えます。参加者を招待しよう。
    </div>
  </div>

  <!-- Event Info Card -->
  <div class="card event-info-card">
    <div class="event-header">
      <h2 class="event-name">{{ event.name }}</h2>
      <span class="type-badge">{{ event.type }}</span>
    </div>
    <div class="event-details">
      <div class="detail-row">
        <mat-icon>person</mat-icon>
        <span class="detail-label">主催者:</span>
        <span class="detail-value">{{ event.organizer }}</span>
      </div>
      <div class="detail-row">
        <mat-icon>schedule</mat-icon>
        <span class="detail-label">所要時間:</span>
        <span class="detail-value">{{ event.duration }}分</span>
      </div>
      <div class="detail-row">
        <mat-icon>event</mat-icon>
        <span class="detail-label">締切日時:</span>
        <span class="detail-value">{{ event.deadline }}</span>
      </div>
    </div>
  </div>

  <!-- Action Buttons -->
  <div class="card action-buttons-card">
    <div class="action-buttons">
      <button class="action-btn" (click)="copyInvitation()">
        <mat-icon>file_copy</mat-icon>
        <span>招待文コピー</span>
      </button>
      <button class="action-btn" (click)="openPreview()">
        <mat-icon>preview</mat-icon>
        <span>回答側確認</span>
      </button>
      <button class="action-btn" (click)="editEvent()">
        <mat-icon>edit</mat-icon>
        <span>編集</span>
      </button>
      <button class="action-btn action-btn--danger" (click)="cancelEvent()">
        <mat-icon>do_not_disturb_on</mat-icon>
        <span>中止</span>
      </button>
    </div>
  </div>

  <!-- Share Section -->
  <div class="card share-card">
    <h3 class="card-title">
      <mat-icon>share</mat-icon>
      URLとメール・SNSで参加者を招待する
    </h3>
    <div class="share-buttons">
      <button class="share-btn share-btn--primary" (click)="copyUrl()">
        <mat-icon>link</mat-icon>
        URLをコピー
      </button>
      <button class="share-btn" (click)="copyInvitation()">
        <mat-icon>content_copy</mat-icon>
        招待文をコピー
      </button>
      <button class="share-btn" (click)="shareByEmail()">
        <mat-icon>mail</mat-icon>
        メールで共有
      </button>
      <button class="share-btn" (click)="shareBySlack()">
        <mat-icon>tag</mat-icon>
        Slackで共有
      </button>
      <button class="share-btn" (click)="shareByChatwork()">
        <mat-icon>chat</mat-icon>
        Chatworkで共有
      </button>
      <button class="share-btn" (click)="copyHtmlDates()">
        <mat-icon>code</mat-icon>
        直近の候補日をHTMLでコピー
      </button>
      <button class="share-btn" (click)="embedEvent()">
        <mat-icon>integration_instructions</mat-icon>
        この予定調整をサイトに埋め込む
      </button>
    </div>
  </div>

  <!-- Footer CTA -->
  <div class="footer-cta">
    <h3 class="footer-cta-title">あなたも予定調整をしよう</h3>
    <div class="footer-cards">
      <div class="footer-card" *ngFor="let card of footerCards">
        <mat-icon class="footer-card-icon">{{ card.icon }}</mat-icon>
        <div class="footer-card-label">{{ card.label }}</div>
        <div class="footer-card-desc">{{ card.description }}</div>
      </div>
    </div>
  </div>
</div>
