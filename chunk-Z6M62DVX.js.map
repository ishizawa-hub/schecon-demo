<!-- ヘッダー -->
<header class="schecon-header">
  <button class="header-back" (click)="goBack()">
    <mat-icon>chevron_left</mat-icon>
  </button>

  <div class="header-banner" *ngIf="candidateCount > 0">
    {{ candidateCount }}件の候補があります
  </div>

  <a class="header-logo" routerLink="/mail">
    <img src="assets/imgs/common/logo.svg" alt="ScheCon" class="header-logo__img">
  </a>

  <div class="header-actions">
    <a class="header-btn header-btn--orange" routerLink="/address-book">
      <mat-icon>import_contacts</mat-icon>
      参加者連絡先
    </a>
    <a class="header-btn header-btn--orange" routerLink="/history">
      <mat-icon>history</mat-icon>
      予定調整履歴
    </a>
    <div class="header-avatar">石</div>
  </div>
</header>

<!-- 左サイドバー -->
<aside class="schecon-sidebar">
  <div class="sidebar-icon sidebar-icon--slack">
    <svg viewBox="0 0 54 54" width="24" height="24">
      <path d="M19.7 27.5c-2.1 0-3.8-1.7-3.8-3.8s1.7-3.8 3.8-3.8h3.8v3.8c0 2.1-1.7 3.8-3.8 3.8z" fill="#E01E5A"/>
      <path d="M21.6 23.7c0-2.1 1.7-3.8 3.8-3.8s3.8 1.7 3.8 3.8v9.5c0 2.1-1.7 3.8-3.8 3.8s-3.8-1.7-3.8-3.8v-9.5z" fill="#36C5F0"/>
      <path d="M25.4 15.3c2.1 0 3.8 1.7 3.8 3.8s-1.7 3.8-3.8 3.8h-3.8v-3.8c0-2.1 1.7-3.8 3.8-3.8z" fill="#2EB67D"/>
      <path d="M29.2 19.1c0 2.1-1.7 3.8-3.8 3.8s-3.8-1.7-3.8-3.8V9.6c0-2.1 1.7-3.8 3.8-3.8s3.8 1.7 3.8 3.8v9.5z" fill="#ECB22E"/>
    </svg>
  </div>
  <!-- 修正 No.65 (2026-04-25): 全ページ共通のスケコンロゴ (favicon.png) に統一 -->
  <button class="sidebar-schedule-btn" (click)="onScheduleButtonClick()">
    <div class="sidebar-schedule-icon">
      <img src="assets/imgs/common/schecon-favicon.png" alt="スケコン" width="20" height="20" />
    </div>
    <span class="sidebar-schedule-text">予定調整をする</span>
  </button>
</aside>

<!-- メインコンテンツ -->
<main class="schecon-main">
  <div class="page-title-section">
    <h1 class="page-title" [style.color]="accentColor">{{ pageTitle }}<mat-icon class="help-icon">help_outline</mat-icon></h1>
    <p class="page-subtitle" *ngIf="pageSubtitle">- {{ pageSubtitle }} -</p>
  </div>
  <ng-content></ng-content>
</main>
