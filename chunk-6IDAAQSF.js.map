<div class="mail-page"
  [class.mail-page--3col]="layoutMode === 'split'"
  [class.mail-page--list-detail]="layoutMode === 'list'"
>
  <!-- モバイルツールバー -->
  <div class="mail-page__mobile-toolbar" *ngIf="isMobileView">
    <button mat-icon-button (click)="toggleMobileSidebar()" matTooltip="フォルダ">
      <mat-icon>menu</mat-icon>
    </button>
    <span class="mail-page__mobile-toolbar-title">{{ folderName }}</span>
    <button mat-icon-button (click)="onCompose()" matTooltip="新規作成">
      <mat-icon>edit</mat-icon>
    </button>
  </div>

  <!-- モバイルサイドバーオーバーレイ -->
  <div
    class="mail-page__sidebar-overlay"
    *ngIf="mobileSidebarOpen"
    (click)="toggleMobileSidebar()"
  ></div>

  <!-- コンテンツエリア（サイドバー + リスト + リーダー） -->
  <div class="mail-page__content">
    <!-- フォルダメニュー -->
    <app-mail-sidebar
      *ngIf="shouldShowSidebar || mobileSidebarOpen"
      class="mail-page__sidebar"
      [class.mail-page__sidebar--mobile-open]="mobileSidebarOpen"
      [folders]="folders"
      [selectedFolderId]="selectedFolderId"
      (folderSelected)="onMobileFolderSelected($event)"
      (composeClicked)="onCompose(); mobileSidebarOpen = false"
    ></app-mail-sidebar>

    <!-- メール一覧 -->
    <div class="mail-page__list" *ngIf="shouldShowList">
      <app-mail-list
        [messages]="messages"
        [selectedMessageId]="selectedMessage?.id || null"
        [folderName]="folderName"
        [layoutMode]="layoutMode"
        (messageSelected)="onMessageSelected($event)"
        (starToggled)="onStarToggle($event)"
        (deleteRequested)="onDeleteMessages($event)"
        (moveRequested)="onMoveMessages($event)"
        (readToggled)="onReadToggle($event)"
        (searchChanged)="onSearchChanged($event)"
        (layoutModeChanged)="setLayoutMode($event)"
      ></app-mail-list>
    </div>

    <!-- メール本文 -->
    <div class="mail-page__reader" *ngIf="shouldShowReader">
      <app-mail-reader
        [message]="selectedMessage"
        [threadMessages]="threadMessages"
        [showBackButton]="layoutMode === 'list' || viewMode !== 'three-pane'"
        (replyClicked)="onReply($event)"
        (replyAllClicked)="onReplyAll($event)"
        (forwardClicked)="onForward($event)"
        (deleteClicked)="onDeleteMessages([$event])"
        (starToggled)="onStarToggle($event)"
        (moveRequested)="onMoveFromReader($event)"
        (readToggled)="onReadToggleFromReader($event)"
        (quickReplySent)="onQuickReply($event)"
        (backClicked)="onBackFromReader()"
      ></app-mail-reader>
    </div>
  </div>

  <!-- モバイルFAB（新規作成） -->
  <button
    class="mail-page__fab"
    *ngIf="isMobileView && !showCompose && !showReader"
    (click)="onCompose()"
    matTooltip="新規メール"
  >
    <mat-icon>edit</mat-icon>
  </button>

  <!-- メール作成ダイアログ -->
  <app-mail-compose
    [config]="composeConfig"
    [contacts]="contacts"
    [isVisible]="showCompose"
    (sendMail)="onSendMail($event)"
    (saveDraft)="onSaveDraft($event)"
    (closed)="onComposeClose()"
  ></app-mail-compose>
</div>
