<div class="mail-sidebar">
  <div class="mail-sidebar__compose">
    <button
      mat-raised-button
      class="mail-sidebar__compose-btn"
      (click)="onCompose()"
    >
      <mat-icon>edit</mat-icon>
      <span>新規作成</span>
    </button>
  </div>

  <mat-nav-list class="mail-sidebar__folders">
    <a
      mat-list-item
      *ngFor="let folder of systemFolders"
      [class.mail-sidebar__folder--active]="folder.id === selectedFolderId"
      (click)="onFolderClick(folder.id)"
    >
      <mat-icon matListItemIcon>{{ folder.icon }}</mat-icon>
      <span matListItemTitle>{{ folder.name }}</span>
      <span
        *ngIf="folder.unreadCount > 0"
        class="mail-sidebar__badge"
      >
        {{ folder.unreadCount }}
      </span>
    </a>
  </mat-nav-list>

</div>
