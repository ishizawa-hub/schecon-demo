<div class="mail-list">
  <!-- Gmail-style Search Bar -->
  <div class="mail-list__search">
    <mat-icon class="mail-list__search-icon">search</mat-icon>
    <input
      type="text"
      class="mail-list__search-input"
      placeholder="メールを検索"
      [(ngModel)]="searchTerm"
      (input)="onSearchInput($event)"
    />
    <button
      *ngIf="searchTerm"
      mat-icon-button
      class="mail-list__search-clear"
      (click)="onClearSearch()"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- Gmail-style Toolbar -->
  <div class="mail-list__toolbar">
    <div class="mail-list__toolbar-left">
      <mat-checkbox
        [checked]="allChecked"
        [indeterminate]="checkedIds.size > 0 && checkedIds.size < messages.length"
        (change)="onSelectAll($event.checked)"
        color="primary"
      ></mat-checkbox>

      <ng-container *ngIf="!hasChecked">
        <button mat-icon-button matTooltip="更新" (click)="onRefresh()" class="mail-list__toolbar-btn">
          <mat-icon>refresh</mat-icon>
        </button>
        <button mat-icon-button [matMenuTriggerFor]="moreMenu" matTooltip="その他" class="mail-list__toolbar-btn">
          <mat-icon>more_vert</mat-icon>
        </button>
        <mat-menu #moreMenu="matMenu">
          <button mat-menu-item (click)="onMarkReadChecked()">
            <mat-icon>drafts</mat-icon> すべて既読にする
          </button>
        </mat-menu>
      </ng-container>

      <ng-container *ngIf="hasChecked">
        <button mat-icon-button matTooltip="アーカイブ" (click)="onMoveChecked('archive')" class="mail-list__toolbar-btn">
          <mat-icon>archive</mat-icon>
        </button>
        <button mat-icon-button matTooltip="削除" (click)="onDeleteChecked()" class="mail-list__toolbar-btn">
          <mat-icon>delete</mat-icon>
        </button>
        <button mat-icon-button matTooltip="既読/未読" (click)="onMarkReadChecked()" class="mail-list__toolbar-btn">
          <mat-icon>drafts</mat-icon>
        </button>
        <button mat-icon-button [matMenuTriggerFor]="moveMenu" matTooltip="移動" class="mail-list__toolbar-btn">
          <mat-icon>drive_file_move</mat-icon>
        </button>
        <mat-menu #moveMenu="matMenu">
          <button mat-menu-item (click)="onMoveChecked('inbox')">
            <mat-icon>inbox</mat-icon> 受信トレイ
          </button>
          <button mat-menu-item (click)="onMoveChecked('spam')">
            <mat-icon>report</mat-icon> 迷惑メール
          </button>
          <button mat-menu-item (click)="onMoveChecked('trash')">
            <mat-icon>delete</mat-icon> ゴミ箱
          </button>
        </mat-menu>
      </ng-container>
    </div>

    <div class="mail-list__toolbar-right">
      <span class="mail-list__page-info" *ngIf="messages.length > 0">
        {{ pageStart }}-{{ pageEnd }} / {{ messages.length }}
      </span>
      <button mat-icon-button class="mail-list__page-btn" [disabled]="!hasPrevPage" (click)="onPrevPage()" matTooltip="前のページ">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button mat-icon-button class="mail-list__page-btn" [disabled]="!hasNextPage" (click)="onNextPage()" matTooltip="次のページ">
        <mat-icon>chevron_right</mat-icon>
      </button>

      <!-- Layout toggle (integrated into toolbar) -->
      <div class="mail-list__layout-toggle">
        <button
          class="mail-list__layout-btn"
          [class.mail-list__layout-btn--active]="layoutMode === 'split'"
          (click)="onSetLayoutMode('split')"
          matTooltip="3カラム表示"
        >
          <mat-icon>vertical_split</mat-icon>
        </button>
        <button
          class="mail-list__layout-btn"
          [class.mail-list__layout-btn--active]="layoutMode === 'list'"
          (click)="onSetLayoutMode('list')"
          matTooltip="リスト表示"
        >
          <mat-icon>view_list</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- Message List with Virtual Scroll -->
  <cdk-virtual-scroll-viewport
    class="mail-list__viewport"
    itemSize="40"
    *ngIf="pagedMessages.length > 0; else emptyState"
  >
    <app-mail-list-item
      *cdkVirtualFor="let message of pagedMessages; trackBy: trackByMessageId"
      [message]="message"
      [isSelected]="message.id === selectedMessageId"
      [isChecked]="isChecked(message.id)"
      (messageClick)="onMessageClick($event)"
      (checkChanged)="onCheckChanged($event)"
      (starToggled)="onStarToggle($event)"
      (deleteClicked)="onDeleteSingle($event)"
      (readToggled)="onReadToggleSingle($event)"
    ></app-mail-list-item>
  </cdk-virtual-scroll-viewport>

  <!-- Empty State -->
  <ng-template #emptyState>
    <div class="mail-list__empty">
      <mat-icon class="mail-list__empty-icon">mail_outline</mat-icon>
      <p class="mail-list__empty-text">
        {{ searchTerm ? '検索結果がありません' : 'メールはありません' }}
      </p>
    </div>
  </ng-template>
</div>
