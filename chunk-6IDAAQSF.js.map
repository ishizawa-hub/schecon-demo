<!-- STEP 8 / Phase 2.2: KeyboardManager の keyboardHeight を bottom margin として補正 -->
<div
  class="mail-compose"
  *ngIf="isVisible"
  [class.mail-compose--minimized]="isMinimized"
  [class.mail-compose--maximized]="isMaximized"
  [style.--keyboard-h.px]="keyboardHeight"
  [style.padding-bottom.px]="keyboardHeight"
>
  <!-- Header -->
  <div class="mail-compose__header" (click)="isMinimized && onMinimize()">
    <span class="mail-compose__title">{{ modeLabel }}</span>
    <div class="mail-compose__header-actions">
      <button mat-icon-button (click)="onMinimize(); $event.stopPropagation()">
        <mat-icon>{{ isMinimized ? 'open_in_full' : 'minimize' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="onMaximize(); $event.stopPropagation()">
        <mat-icon>{{ isMaximized ? 'close_fullscreen' : 'open_in_full' }}</mat-icon>
      </button>
      <button mat-icon-button (click)="onClose(); $event.stopPropagation()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Body (hidden when minimized) -->
  <div class="mail-compose__body" *ngIf="!isMinimized">
    <!-- To field -->
    <div class="mail-compose__field">
      <label class="mail-compose__label">To</label>
      <div class="mail-compose__chips-input">
        <span
          class="mail-compose__chip"
          *ngFor="let r of toRecipients"
        >
          {{ r.name || r.email }}
          <button class="mail-compose__chip-remove" (click)="onRemoveRecipient(r.email, 'to')">
            <mat-icon>close</mat-icon>
          </button>
        </span>
        <input
          class="mail-compose__input"
          [(ngModel)]="toInput"
          (input)="onFilterContacts(toInput, 'to')"
          (keydown.enter)="onAddRecipientFromInput('to'); $event.preventDefault()"
          placeholder=""
        />
      </div>
      <button
        class="mail-compose__cc-toggle"
        *ngIf="!showCcBcc"
        (click)="showCcBcc = true"
      >
        Cc/Bcc
      </button>
    </div>

    <!-- Autocomplete dropdown -->
    <div class="mail-compose__autocomplete" *ngIf="filteredContacts.length > 0">
      <div
        class="mail-compose__autocomplete-item"
        *ngFor="let contact of filteredContacts"
        (click)="onAddRecipient(contact, 'to')"
      >
        <span class="mail-compose__autocomplete-name">{{ contact.name }}</span>
        <span class="mail-compose__autocomplete-email">{{ contact.email }}</span>
      </div>
    </div>

    <!-- Cc field -->
    <div class="mail-compose__field" *ngIf="showCcBcc">
      <label class="mail-compose__label">Cc</label>
      <div class="mail-compose__chips-input">
        <span
          class="mail-compose__chip"
          *ngFor="let r of ccRecipients"
        >
          {{ r.name || r.email }}
          <button class="mail-compose__chip-remove" (click)="onRemoveRecipient(r.email, 'cc')">
            <mat-icon>close</mat-icon>
          </button>
        </span>
        <input
          class="mail-compose__input"
          [(ngModel)]="ccInput"
          (input)="onFilterContacts(ccInput, 'cc')"
          (keydown.enter)="onAddRecipientFromInput('cc'); $event.preventDefault()"
          placeholder=""
        />
      </div>
    </div>

    <!-- Bcc field -->
    <div class="mail-compose__field" *ngIf="showCcBcc">
      <label class="mail-compose__label">Bcc</label>
      <div class="mail-compose__chips-input">
        <span
          class="mail-compose__chip"
          *ngFor="let r of bccRecipients"
        >
          {{ r.name || r.email }}
          <button class="mail-compose__chip-remove" (click)="onRemoveRecipient(r.email, 'bcc')">
            <mat-icon>close</mat-icon>
          </button>
        </span>
        <input
          class="mail-compose__input"
          [(ngModel)]="bccInput"
          (input)="onFilterContacts(bccInput, 'bcc')"
          (keydown.enter)="onAddRecipientFromInput('bcc'); $event.preventDefault()"
          placeholder=""
        />
      </div>
    </div>

    <!-- Subject -->
    <div class="mail-compose__field">
      <label class="mail-compose__label">件名</label>
      <input
        class="mail-compose__subject-input"
        [(ngModel)]="subject"
        placeholder="件名"
      />
    </div>

    <mat-divider></mat-divider>

    <!-- Editor -->
    <div
      class="mail-compose__editor"
      [class.mail-compose__editor--dragover]="isDragOver"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave()"
      (drop)="onDrop($event)"
    >
      <textarea
        class="mail-compose__textarea"
        [(ngModel)]="bodyText"
        placeholder="本文を入力..."
      ></textarea>
      <div class="mail-compose__drop-overlay" *ngIf="isDragOver">
        <mat-icon>cloud_upload</mat-icon>
        <span>ファイルをドロップして添付</span>
      </div>
    </div>

    <!-- 添付ファイル一覧 (ユーザー指示 2026-04-21) -->
    <div class="mail-compose__attachments" *ngIf="attachments.length">
      <div class="mail-compose__attachment" *ngFor="let a of attachments; let i = index">
        <mat-icon class="mail-compose__attachment-icon">attach_file</mat-icon>
        <span class="mail-compose__attachment-name">{{ a.name }}</span>
        <span class="mail-compose__attachment-size">{{ formatFileSize(a.size) }}</span>
        <button mat-icon-button class="mail-compose__attachment-remove"
                (click)="removeAttachment(i)" matTooltip="削除">
          <mat-icon>close</mat-icon>
        </button>
      </div>
    </div>

    <!-- Footer: 送信 / 予約送信 / 下書き / 添付 / AI / 破棄 -->
    <div class="mail-compose__footer">
      <div class="mail-compose__primary-actions">
        <button
          mat-raised-button
          class="mail-compose__send-btn"
          (click)="onSend()"
          [disabled]="toRecipients.length === 0"
        >
          <mat-icon>send</mat-icon>
          送信
        </button>
        <button
          mat-stroked-button
          class="mail-compose__schedule-btn"
          (click)="openScheduleSend()"
          [disabled]="toRecipients.length === 0"
          matTooltip="指定日時に送信">
          <mat-icon>schedule_send</mat-icon>
          <span class="mail-compose__btn-label">予約送信</span>
        </button>
        <button
          mat-stroked-button
          class="mail-compose__draft-btn"
          (click)="onSaveDraft()"
          matTooltip="下書きを保存">
          <mat-icon>save</mat-icon>
          <span class="mail-compose__btn-label">下書き保存</span>
        </button>
      </div>
      <div class="mail-compose__footer-actions">
        <button mat-icon-button matTooltip="AI で文面作成" (click)="openAiCompose()">
          <mat-icon>auto_fix_high</mat-icon>
        </button>
        <button mat-icon-button matTooltip="添付ファイル" (click)="onAttachClick()">
          <mat-icon>attach_file</mat-icon>
        </button>
        <button mat-icon-button matTooltip="破棄" (click)="onClose()">
          <mat-icon>delete</mat-icon>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- 予約送信モーダル -->
<div class="mail-compose-overlay" *ngIf="showScheduleModal" (click)="cancelScheduleSend()">
  <div class="mail-compose-dialog" (click)="$event.stopPropagation()">
    <header class="mail-compose-dialog__header">
      <h3><mat-icon>schedule_send</mat-icon> 予約送信</h3>
      <button mat-icon-button (click)="cancelScheduleSend()"><mat-icon>close</mat-icon></button>
    </header>
    <div class="mail-compose-dialog__body">
      <p class="mail-compose-dialog__desc">指定した日時にメールを自動送信します。</p>
      <label class="mail-compose-dialog__label">日付</label>
      <input type="date" class="mail-compose-dialog__input" [(ngModel)]="scheduleDate" />
      <label class="mail-compose-dialog__label">時刻</label>
      <input type="time" class="mail-compose-dialog__input" [(ngModel)]="scheduleTime" />
    </div>
    <footer class="mail-compose-dialog__footer">
      <button mat-button (click)="cancelScheduleSend()">キャンセル</button>
      <button mat-raised-button class="mail-compose__send-btn"
              [disabled]="!scheduleDate || !scheduleTime"
              (click)="confirmScheduleSend()">
        <mat-icon>schedule_send</mat-icon>
        予約する
      </button>
    </footer>
  </div>
</div>

<!-- AI 文書作成モーダル -->
<div class="mail-compose-overlay" *ngIf="showAiModal" (click)="cancelAiCompose()">
  <div class="mail-compose-dialog" (click)="$event.stopPropagation()">
    <header class="mail-compose-dialog__header">
      <h3><mat-icon>auto_fix_high</mat-icon> AI で文面作成</h3>
      <button mat-icon-button (click)="cancelAiCompose()"><mat-icon>close</mat-icon></button>
    </header>
    <div class="mail-compose-dialog__body">
      <div class="mail-compose-dialog__tabs">
        <button type="button"
                [class.mail-compose-dialog__tab--active]="aiMode === 'compose'"
                (click)="aiMode = 'compose'">新規作成</button>
        <button type="button"
                [class.mail-compose-dialog__tab--active]="aiMode === 'reply'"
                (click)="aiMode = 'reply'">返信</button>
        <button type="button"
                [class.mail-compose-dialog__tab--active]="aiMode === 'polish'"
                (click)="aiMode = 'polish'">既存の文章を整える</button>
      </div>
      <label class="mail-compose-dialog__label">依頼内容</label>
      <textarea class="mail-compose-dialog__textarea"
                rows="4"
                placeholder="例: 来週月曜 14 時の打合せ日程変更をお願いするメールを作成して"
                [(ngModel)]="aiPrompt"></textarea>
    </div>
    <footer class="mail-compose-dialog__footer">
      <button mat-button (click)="cancelAiCompose()">キャンセル</button>
      <button mat-raised-button class="mail-compose__send-btn"
              [disabled]="!aiPrompt.trim() || aiGenerating"
              (click)="generateAiBody()">
        <mat-icon>auto_fix_high</mat-icon>
        {{ aiGenerating ? '生成中…' : '作成する' }}
      </button>
    </footer>
  </div>
</div>
