<div
  class="mail-list-item"
  [class.mail-list-item--unread]="!message.isRead"
  [class.mail-list-item--selected]="isSelected"
  [class.mail-list-item--checked]="isChecked"
  (click)="onMessageClick($event)"
  (mouseenter)="showHoverActions = true"
  (mouseleave)="showHoverActions = false"
>
  <!-- Checkbox -->
  <div class="mail-list-item__checkbox" (click)="$event.stopPropagation()">
    <mat-checkbox
      [checked]="isChecked"
      (change)="onCheckChange($event.checked)"
      color="primary"
    ></mat-checkbox>
  </div>

  <!-- Star -->
  <button
    class="mail-list-item__star"
    (click)="onStarClick($event)"
    [class.mail-list-item__star--active]="message.isStarred"
  >
    <mat-icon>{{ message.isStarred ? 'star' : 'star_border' }}</mat-icon>
  </button>

  <!-- Avatar (sender initials) -->
  <div
    class="mail-list-item__avatar"
    [style.background-color]="avatarColor"
  >
    {{ senderInitial }}
  </div>

  <!-- Sender (fixed width) -->
  <span class="mail-list-item__sender" [class.mail-list-item__sender--bold]="!message.isRead">
    {{ message.from.name }}
  </span>

  <!-- Subject + Snippet (fills remaining space) -->
  <div class="mail-list-item__content">
    <span class="mail-list-item__subject" [class.mail-list-item__subject--bold]="!message.isRead">{{ message.subject }}</span>
    <span class="mail-list-item__snippet"> - {{ message.snippet }}</span>
    <mat-icon class="mail-list-item__attachment-icon" *ngIf="message.hasAttachments">attach_file</mat-icon>
  </div>

  <!-- Date (hidden on hover, replaced by actions) -->
  <span class="mail-list-item__date" [class.mail-list-item__date--hidden]="showHoverActions">
    {{ smartDate }}
  </span>

  <!-- Hover actions (replaces date on hover) -->
  <div class="mail-list-item__hover-actions" *ngIf="showHoverActions">
    <button mat-icon-button (click)="onArchiveClick($event)" matTooltip="アーカイブ">
      <mat-icon>archive</mat-icon>
    </button>
    <button mat-icon-button (click)="onDeleteClick($event)" matTooltip="削除">
      <mat-icon>delete</mat-icon>
    </button>
    <button mat-icon-button (click)="onReadToggle($event)" [matTooltip]="message.isRead ? '未読にする' : '既読にする'">
      <mat-icon>{{ message.isRead ? 'mark_email_unread' : 'drafts' }}</mat-icon>
    </button>
    <button mat-icon-button (click)="onStarClick($event)" matTooltip="スター">
      <mat-icon>{{ message.isStarred ? 'star' : 'star_border' }}</mat-icon>
    </button>
  </div>
</div>
