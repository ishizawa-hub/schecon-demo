<div class="service-page">
  <div class="service-container">
    <app-settings-tab-nav></app-settings-tab-nav>

    <h1 class="page-title">外部サービスとの連携</h1>

    <div class="service-grid">
      <div
        class="service-card"
        *ngFor="let service of services; let i = index"
      >
        <div class="service-logo-area" [innerHTML]="service.logoSvg"></div>

        <h3 class="service-name">{{ service.name }}</h3>

        <span class="status-badge" [class.connected]="service.connected">
          <span class="status-dot"></span>
          {{ service.connected ? '接続済み' : '未接続' }}
        </span>

        <p class="service-description">{{ service.description }}</p>

        <!-- 接続済み情報 -->
        <div class="connected-info" *ngIf="service.connected && service.connectedInfo">
          <mat-icon>info_outline</mat-icon>
          <span>{{ service.connectedInfo }}</span>
        </div>

        <!-- 補足テキスト -->
        <p class="service-note" *ngIf="service.note">{{ service.note }}</p>

        <div class="service-actions">
          <!-- ボタン表示 -->
          <button class="btn-configure" *ngIf="service.buttonLabel" (click)="onConfigureClick(service)">
            <mat-icon>settings</mat-icon>
            {{ service.buttonLabel }}
          </button>

          <!-- トグル表示 -->
          <div class="toggle-row" *ngIf="service.toggleLabel">
            <span class="toggle-label">{{ service.toggleLabel }}</span>
            <button
              class="toggle-switch"
              [class.active]="service.connected"
              (click)="toggleService(i)"
              role="switch"
              [attr.aria-checked]="service.connected"
            >
              <span class="toggle-knob"></span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

<!-- Zoom PMI Dialog -->
<div class="zoom-dialog-overlay" *ngIf="showZoomDialog" (click)="closeZoomDialog()">
  <div class="zoom-dialog" (click)="$event.stopPropagation()">
    <div class="zoom-dialog-header">
      <h2>Zoom 連携の設定</h2>
      <button class="zoom-dialog-close" (click)="closeZoomDialog()">
        <mat-icon>close</mat-icon>
      </button>
    </div>

    <div class="zoom-dialog-body">
      <div class="zoom-form-group">
        <label class="zoom-form-label">Zoom PMI</label>
        <input
          type="text"
          class="zoom-form-input"
          [(ngModel)]="zoomPmi"
          placeholder="Zoom PMI（10桁の数字）を入力してください"
        />
      </div>

      <div class="zoom-form-group">
        <label class="zoom-form-label">パスコード</label>
        <input
          type="text"
          class="zoom-form-input"
          [(ngModel)]="zoomPasscode"
          placeholder="Zoom パスコードを入力してください"
        />
      </div>

      <div class="zoom-help-video">
        <div class="zoom-help-thumbnail">
          <div class="zoom-help-icon">
            <mat-icon>play_circle_filled</mat-icon>
          </div>
          <p class="zoom-help-text">パーソナルミーティングID &amp; パスコード<br>確認方法(PC&amp;スマホ)</p>
        </div>
      </div>
    </div>

    <button class="zoom-dialog-ok" (click)="saveZoomSettings()">OK</button>
  </div>
</div>
</div>
