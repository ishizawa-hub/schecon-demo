<div class="community-create-page">
  <!-- 上部固定ヘッダー: ← + タイトル -->
  <header class="community-create-page__header">
    <button class="community-create-page__back" (click)="onBack()" aria-label="戻る">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <h2 class="community-create-page__title">コミュニティを作成</h2>
  </header>

  <div class="community-create-page__body">
    <div class="community-create-page__field">
      <label class="community-create-page__label">画像URL</label>
      <input
        class="community-create-page__input"
        type="text"
        [(ngModel)]="imageUrl"
        placeholder="https://example.com/image.jpg"
      />
      <div class="community-create-page__preview" *ngIf="imagePreviewUrl">
        <img [src]="imagePreviewUrl" alt="プレビュー" />
      </div>
    </div>

    <div class="community-create-page__field">
      <label class="community-create-page__label">タイトル <span class="community-create-page__required">*</span></label>
      <input
        class="community-create-page__input"
        type="text"
        [(ngModel)]="title"
        placeholder="コミュニティ名を入力"
        required
      />
    </div>

    <div class="community-create-page__field">
      <label class="community-create-page__label">説明</label>
      <textarea
        class="community-create-page__textarea"
        [(ngModel)]="description"
        placeholder="コミュニティの説明を入力"
        rows="4"
      ></textarea>
    </div>

    <div class="community-create-page__field">
      <label class="community-create-page__label">タグ（カンマ区切り）</label>
      <input
        class="community-create-page__input"
        type="text"
        [(ngModel)]="tagsText"
        placeholder="例: エンジニア, デザイン, 起業"
      />
    </div>

    <div class="community-create-page__field">
      <label class="community-create-page__label">画像を添付（任意）</label>
      <app-image-upload
        recommendedSize="1200 x 630px (16:9)"
        (imageSelected)="onImageSelected($event)"
        (imageRemoved)="onImageRemoved()"
      ></app-image-upload>
    </div>
  </div>

  <!-- 下部固定アクションバー -->
  <footer class="community-create-page__footer">
    <button class="community-create-page__cancel-btn" (click)="onCancel()">キャンセル</button>
    <button
      class="community-create-page__submit-btn"
      (click)="onCreate()"
      [disabled]="!title.trim()"
    >
      作成
    </button>
  </footer>
</div>
