<!-- STEP 9: KeyboardManager 適用 - SP キーボード時の page 高さ補正 -->
<div class="profile-page" [style.padding-bottom.px]="keyboardHeight">
  <div class="profile-container">
    <app-settings-tab-nav></app-settings-tab-nav>
    <h1 class="page-title">プロフィール設定</h1>

    <form [formGroup]="profileForm" (ngSubmit)="onSave()">

      <!-- Section 1: プロフィール情報 -->
      <section class="card">
        <h2 class="card-title">プロフィール情報</h2>

        <!-- アバター -->
        <!-- 修正 No.35/36 (2026-04-25): プレビューサイズを常に同一 (96x96) に固定し、
             画像の拡大率はプレビュー内の <img> の transform:scale のみで表現する。
             スライダー (type=range) を画像倍率にバインドして即座に反映する。 -->
        <div class="avatar-section">
          <div class="avatar-preview">
            <img
              *ngIf="avatarPreview"
              [src]="avatarPreview"
              alt="アバター"
              [style.transform]="'scale(' + avatarScale + ')'"
            />
            <mat-icon *ngIf="!avatarPreview">person</mat-icon>
          </div>
          <div class="avatar-actions">
            <label class="btn-upload">
              画像を選択
              <input type="file" accept="image/*" (change)="onAvatarChange($event)" hidden />
            </label>
            <span class="avatar-hint">JPG, PNG（5MB以下）</span>
            <!-- 修正 No.36 (2026-04-25): プレビュー画像サイズの調整スライダー -->
            <label class="avatar-size-slider" *ngIf="avatarPreview">
              <span class="avatar-size-slider__label">サイズ</span>
              <input
                type="range"
                min="0.5"
                max="2"
                step="0.05"
                [value]="avatarScale"
                (input)="onAvatarScaleChange($event)"
              />
            </label>
          </div>
        </div>

        <!-- 姓・名 -->
        <div class="field-row">
          <div class="field">
            <label class="field-label">
              姓
              <span class="badge required">必須</span>
            </label>
            <input type="text" formControlName="lastName" placeholder="山田" class="input"
              [class.input-error]="profileForm.get('lastName')?.touched && profileForm.get('lastName')?.invalid" />
          </div>
          <div class="field">
            <label class="field-label">
              名
              <span class="badge required">必須</span>
            </label>
            <input type="text" formControlName="firstName" placeholder="太郎" class="input"
              [class.input-error]="profileForm.get('firstName')?.touched && profileForm.get('firstName')?.invalid" />
          </div>
        </div>

        <!-- フリガナ -->
        <div class="field">
          <label class="field-label">
            フリガナ
            <span class="badge optional">任意</span>
          </label>
          <input type="text" formControlName="furigana" placeholder="セイ メイ" class="input" />
        </div>

        <!-- 会社名 -->
        <div class="field">
          <label class="field-label">
            会社名
            <span class="badge optional">任意</span>
          </label>
          <input type="text" formControlName="company" placeholder="株式会社○○" class="input" />
        </div>

        <!-- 部署・役職 -->
        <div class="field-row">
          <div class="field">
            <label class="field-label">
              部署
              <span class="badge optional">任意</span>
            </label>
            <input type="text" formControlName="department" placeholder="営業部" class="input" />
          </div>
          <div class="field">
            <label class="field-label">
              役職
              <span class="badge optional">任意</span>
            </label>
            <input type="text" formControlName="jobTitle" placeholder="マネージャー" class="input" />
          </div>
        </div>

        <!-- キャッチコピー -->
        <div class="field">
          <label class="field-label">
            キャッチコピー
            <span class="badge optional">任意</span>
          </label>
          <input type="text" formControlName="catchphrase" placeholder="一言で自分を表すフレーズ" class="input" />
        </div>

        <!-- 自己紹介 -->
        <div class="field">
          <label class="field-label">
            自己紹介
            <span class="badge optional">任意</span>
          </label>
          <textarea formControlName="bio" placeholder="経歴やスキルなど自由に記入" class="input textarea" rows="4"></textarea>
        </div>

        <!-- 出身地 -->
        <div class="field">
          <label class="field-label">
            出身地
            <span class="badge optional">任意</span>
          </label>
          <input type="text" formControlName="birthplace" placeholder="東京都" class="input" />
        </div>

        <!-- 生年月日 -->
        <div class="field">
          <label class="field-label">
            生年月日
            <span class="badge optional">任意</span>
          </label>
          <input type="date" formControlName="birthday" class="input" />
        </div>
      </section>

      <!-- Section 2: 連絡先情報 -->
      <section class="card">
        <h2 class="card-title">連絡先情報</h2>

        <div class="field">
          <label class="field-label">
            電話番号
            <span class="badge optional">任意</span>
          </label>
          <input type="tel" formControlName="phone" placeholder="090-0000-0000" class="input" />
        </div>

        <div class="field">
          <label class="field-label">
            住所
            <span class="badge optional">任意</span>
          </label>
          <input type="text" formControlName="address" placeholder="東京都渋谷区..." class="input" />
        </div>

        <div class="field">
          <label class="field-label">
            ホームページURL
            <span class="badge optional">任意</span>
          </label>
          <input type="url" formControlName="website" placeholder="https://" class="input" />
        </div>
      </section>

      <!-- Section 3: SNS -->
      <section class="card">
        <h2 class="card-title">SNS</h2>

        <div class="field">
          <label class="field-label">
            Facebook
            <span class="badge optional">任意</span>
          </label>
          <div class="input-with-icon">
            <span class="input-icon">
              <mat-icon svgIcon="facebook" *ngIf="false"></mat-icon>
              <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M22 12c0-5.523-4.477-10-10-10S2 6.477 2 12c0 4.991 3.657 9.128 8.438 9.878v-6.987h-2.54V12h2.54V9.797c0-2.506 1.492-3.89 3.777-3.89 1.094 0 2.238.195 2.238.195v2.46h-1.26c-1.243 0-1.63.771-1.63 1.562V12h2.773l-.443 2.89h-2.33v6.988C18.343 21.128 22 16.991 22 12z"/>
              </svg>
            </span>
            <input type="url" formControlName="facebook" placeholder="https://facebook.com/username" class="input input-icon-padding" />
          </div>
        </div>

        <div class="field">
          <label class="field-label">
            X (Twitter)
            <span class="badge optional">任意</span>
          </label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
              </svg>
            </span>
            <input type="url" formControlName="twitter" placeholder="https://x.com/username" class="input input-icon-padding" />
          </div>
        </div>

        <div class="field">
          <label class="field-label">
            Instagram
            <span class="badge optional">任意</span>
          </label>
          <div class="input-with-icon">
            <span class="input-icon">
              <svg class="sns-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zM12 0C8.741 0 8.333.014 7.053.072 2.695.272.273 2.69.073 7.052.014 8.333 0 8.741 0 12c0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98C8.333 23.986 8.741 24 12 24c3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98C15.668.014 15.259 0 12 0zm0 5.838a6.162 6.162 0 100 12.324 6.162 6.162 0 000-12.324zM12 16a4 4 0 110-8 4 4 0 010 8zm6.406-11.845a1.44 1.44 0 100 2.881 1.44 1.44 0 000-2.881z"/>
              </svg>
            </span>
            <input type="url" formControlName="instagram" placeholder="https://instagram.com/username" class="input input-icon-padding" />
          </div>
        </div>
      </section>

      <!-- Section 4: スキル・タグ -->
      <section class="card">
        <h2 class="card-title">スキル・タグ</h2>

        <div class="field">
          <label class="field-label">
            スキル
            <span class="badge optional">任意</span>
          </label>
          <div class="chips-container">
            <span class="chip" *ngFor="let skill of skills; let i = index">
              {{ skill }}
              <button type="button" class="chip-remove" (click)="removeSkill(i)">
                <mat-icon>close</mat-icon>
              </button>
            </span>
          </div>
          <mat-chip-grid #chipGrid>
            <input
              placeholder="スキルを入力してEnterで追加"
              [matChipInputFor]="chipGrid"
              [matChipInputSeparatorKeyCodes]="separatorKeyCodes"
              (matChipInputTokenEnd)="addSkill($event)"
              class="input"
            />
          </mat-chip-grid>
        </div>
      </section>

      <!-- Section 5: 経歴 -->
      <section class="card">
        <h2 class="card-title">経歴</h2>

        <div formArrayName="careers">
          <div *ngFor="let career of careers.controls; let i = index" [formGroupName]="i" class="dynamic-entry">
            <div class="entry-header">
              <span class="entry-number">経歴 {{ i + 1 }}</span>
              <button type="button" class="btn-remove" (click)="removeCareer(i)">
                <mat-icon>delete_outline</mat-icon>
                削除
              </button>
            </div>

            <div class="field-row">
              <div class="field">
                <label class="field-label">開始</label>
                <input type="month" formControlName="periodFrom" class="input" />
              </div>
              <div class="field">
                <label class="field-label">終了</label>
                <input type="month" formControlName="periodTo" class="input" placeholder="現在" />
              </div>
            </div>

            <div class="field-row">
              <div class="field">
                <label class="field-label">会社名</label>
                <input type="text" formControlName="company" placeholder="株式会社○○" class="input" />
              </div>
              <div class="field">
                <label class="field-label">役職</label>
                <input type="text" formControlName="position" placeholder="エンジニア" class="input" />
              </div>
            </div>

            <div class="field">
              <label class="field-label">説明</label>
              <textarea formControlName="description" placeholder="業務内容など" class="input textarea" rows="2"></textarea>
            </div>
          </div>
        </div>

        <button type="button" class="btn-add" (click)="addCareer()">
          <mat-icon>add</mat-icon>
          経歴を追加
        </button>
      </section>

      <!-- Section 6: 学歴 -->
      <section class="card">
        <h2 class="card-title">学歴</h2>

        <div formArrayName="educations">
          <div *ngFor="let edu of educations.controls; let i = index" [formGroupName]="i" class="dynamic-entry">
            <div class="entry-header">
              <span class="entry-number">学歴 {{ i + 1 }}</span>
              <button type="button" class="btn-remove" (click)="removeEducation(i)">
                <mat-icon>delete_outline</mat-icon>
                削除
              </button>
            </div>

            <div class="field-row">
              <div class="field">
                <label class="field-label">開始</label>
                <input type="month" formControlName="periodFrom" class="input" />
              </div>
              <div class="field">
                <label class="field-label">終了</label>
                <input type="month" formControlName="periodTo" class="input" />
              </div>
            </div>

            <div class="field">
              <label class="field-label">学校名</label>
              <input type="text" formControlName="school" placeholder="○○大学" class="input" />
            </div>

            <div class="field">
              <label class="field-label">学部・学科</label>
              <input type="text" formControlName="major" placeholder="工学部 情報工学科" class="input" />
            </div>
          </div>
        </div>

        <button type="button" class="btn-add" (click)="addEducation()">
          <mat-icon>add</mat-icon>
          学歴を追加
        </button>
      </section>

      <!-- Bottom Actions -->
      <div class="bottom-actions">
        <button type="submit" class="btn-save">
          保存する
        </button>
        <button type="button" class="btn-danger-link" (click)="onDeleteAccount()">
          退会する
        </button>
      </div>

    </form>

    <!-- アバターエディタ ダイアログ -->
    <div class="avatar-editor-overlay" *ngIf="showAvatarEditor" (click)="onAvatarEditorCancel()">
      <div class="avatar-editor" (click)="$event.stopPropagation()">
        <div class="avatar-editor__header">
          <h2>プロフィール画像の調整</h2>
          <button class="avatar-editor__close" (click)="onAvatarEditorCancel()">
            <mat-icon>close</mat-icon>
          </button>
        </div>

        <div class="avatar-editor__body">
          <div
            class="avatar-editor__canvas"
            (mousedown)="onAvatarDragStart($event)"
            (mousemove)="onAvatarDragMove($event)"
            (mouseup)="onAvatarDragEnd()"
            (mouseleave)="onAvatarDragEnd()"
            (touchstart)="onAvatarTouchStart($event)"
            (touchmove)="onAvatarTouchMove($event)"
            (touchend)="onAvatarDragEnd()"
          >
            <div class="avatar-editor__circle-mask">
              <img
                *ngIf="avatarEditorSrc"
                [src]="avatarEditorSrc"
                alt="編集中"
                class="avatar-editor__image"
                [style.transform]="'scale(' + avatarZoom + ') translate(' + avatarPanX + 'px, ' + avatarPanY + 'px)'"
                draggable="false"
              />
            </div>
          </div>

          <div class="avatar-editor__controls">
            <button class="avatar-editor__zoom-btn" (click)="onAvatarZoomOut()" title="縮小">
              <mat-icon>remove</mat-icon>
            </button>
            <input
              type="range"
              class="avatar-editor__slider"
              [value]="avatarZoom"
              min="0.5"
              max="3"
              step="0.05"
              (input)="onAvatarZoomChange($event)"
            />
            <button class="avatar-editor__zoom-btn" (click)="onAvatarZoomIn()" title="拡大">
              <mat-icon>add</mat-icon>
            </button>
          </div>

          <p class="avatar-editor__hint">ドラッグで位置を調整、スライダーでズーム</p>
        </div>

        <div class="avatar-editor__footer">
          <button class="avatar-editor__btn-cancel" (click)="onAvatarEditorCancel()">キャンセル</button>
          <button class="avatar-editor__btn-save" (click)="onAvatarSave()">保存</button>
        </div>
      </div>
    </div>

  </div>
</div>
