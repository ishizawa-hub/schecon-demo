<!-- 修正 No.55 (2026-04-24): 予約投稿一覧パネル -->
<div class="scheduled-list" role="dialog" aria-label="予約投稿一覧">
  <div class="scheduled-list__header">
    <span class="scheduled-list__title">予約投稿 ({{ items.length }}件)</span>
    <button
      type="button"
      class="scheduled-list__close"
      aria-label="閉じる"
      (click)="onClose()"
    >
      ×
    </button>
  </div>
  <div class="scheduled-list__body">
    <div class="scheduled-list__empty" *ngIf="items.length === 0">
      予約投稿はありません
    </div>
    <div
      class="scheduled-list__item"
      *ngFor="let item of items; trackBy: trackById"
    >
      <div class="scheduled-list__item-main">
        <div class="scheduled-list__item-time">
          <span class="scheduled-list__clock">🕒</span>
          {{ formatTime(item.scheduledAt) }}
        </div>
        <div class="scheduled-list__item-text">{{ preview(item.text) }}</div>
      </div>
      <div class="scheduled-list__item-actions">
        <button
          type="button"
          class="scheduled-list__icon-btn"
          aria-label="予約を編集"
          (click)="onEdit(item, $event)"
        >
          編集
        </button>
        <button
          type="button"
          class="scheduled-list__icon-btn scheduled-list__icon-btn--danger"
          aria-label="予約を削除"
          (click)="onDelete(item, $event)"
        >
          削除
        </button>
      </div>
    </div>
  </div>
</div>
