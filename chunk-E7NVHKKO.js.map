<!-- 修正 No.55 (2026-04-24): 予約投稿モーダル -->
<div class="schedule-modal" role="dialog" aria-labelledby="scheduleModalTitle">
  <div class="schedule-modal__header">
    <h2 id="scheduleModalTitle" class="schedule-modal__title">{{ title }}</h2>
    <button
      type="button"
      class="schedule-modal__close"
      aria-label="閉じる"
      (click)="onCancel()"
    >
      ×
    </button>
  </div>

  <div class="schedule-modal__body">
    <div class="schedule-modal__field-row">
      <label class="schedule-modal__field">
        <span class="schedule-modal__label">日付</span>
        <input
          type="date"
          class="schedule-modal__input"
          [(ngModel)]="dateValue"
          (ngModelChange)="onDateTimeChange()"
          aria-label="送信日"
        />
      </label>
      <label class="schedule-modal__field">
        <span class="schedule-modal__label">時刻</span>
        <input
          type="time"
          class="schedule-modal__input"
          [(ngModel)]="timeValue"
          (ngModelChange)="onDateTimeChange()"
          aria-label="送信時刻"
        />
      </label>
    </div>

    <div class="schedule-modal__presets" role="group" aria-label="クイックプリセット">
      <button type="button" class="schedule-modal__preset" (click)="applyPreset('in1h')">
        1時間後
      </button>
      <button type="button" class="schedule-modal__preset" (click)="applyPreset('tomorrow9')">
        明日の朝 9:00
      </button>
      <button type="button" class="schedule-modal__preset" (click)="applyPreset('nextMon9')">
        来週月曜 9:00
      </button>
    </div>

    <div class="schedule-modal__preview">
      <div class="schedule-modal__preview-label">プレビュー</div>
      <div class="schedule-modal__preview-body">{{ previewText }}</div>
    </div>

    <p *ngIf="errorMessage" class="schedule-modal__error" role="alert">
      {{ errorMessage }}
    </p>
  </div>

  <div class="schedule-modal__actions">
    <button
      type="button"
      class="schedule-modal__btn schedule-modal__btn--cancel"
      (click)="onCancel()"
    >
      キャンセル
    </button>
    <button
      type="button"
      class="schedule-modal__btn schedule-modal__btn--primary"
      (click)="onConfirm()"
      cdkFocusInitial
    >
      {{ confirmText }}
    </button>
  </div>
</div>
