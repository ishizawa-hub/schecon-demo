<div class="address-book-page">
  <!-- ヘッダー -->
  <div class="page-header">
    <h1 class="page-title">参加者連絡先</h1>
    <!-- 修正 No.65 (2026-04-25): スケコンロゴ前置 + 全ページ共通のグローバル ScheduleModal を起動 -->
    <button class="btn btn--primary btn--with-schecon-logo" (click)="onCreateSchedule()">
      <img class="schecon-logo" src="assets/imgs/common/schecon-favicon.png" alt="スケコン" />
      予定調整をする
    </button>
  </div>

  <!-- フィルター/検索エリア -->
  <div class="filter-card">
    <!-- 検索ボックス -->
    <div class="search-row">
      <div class="search-box">
        <mat-icon class="search-box__icon">search</mat-icon>
        <input
          type="text"
          class="search-box__input"
          placeholder="名前、会社名、メールアドレス、予定名で検索"
          [(ngModel)]="searchQuery"
          (keyup.enter)="onSearch()" />
        <button class="search-box__btn" (click)="onSearch()">検索</button>
      </div>
    </div>

    <!-- ソート & アクション -->
    <div class="controls-row">
      <div class="sort-group">
        <label class="radio-label">
          <input type="radio" name="sort" value="name" [(ngModel)]="sortType" (change)="onSortChange()" />
          <span class="radio-custom"></span>
          名前順
        </label>
        <label class="radio-label">
          <input type="radio" name="sort" value="date" [(ngModel)]="sortType" (change)="onSortChange()" />
          <span class="radio-custom"></span>
          登録日順
        </label>
      </div>

      <!-- 修正 No.62 (2026-04-25): スプレッドシート (CSV) 実エクスポート -->
      <button class="btn btn--ghost" (click)="onCsvDownload()" matTooltip="Excel / Google スプレッドシートで開ける CSV を書き出します">
        <mat-icon>download</mat-icon>
        CSVダウンロード
      </button>
    </div>

    <!-- 選択 & ページネーション -->
    <div class="list-controls">
      <label class="checkbox-label">
        <input type="checkbox" [(ngModel)]="selectAll" (change)="toggleSelectAll()" />
        <span class="checkbox-custom"></span>
        全てを選択
      </label>

      <div class="pagination">
        <span class="pagination__count">{{ totalItems }}件中 {{ displayStart }}-{{ displayEnd }}件を表示</span>
        <button class="pagination__btn" [disabled]="currentPage === 1" (click)="prevPage()">
          <mat-icon>chevron_left</mat-icon>
        </button>
        <button class="pagination__btn" [disabled]="displayEnd >= totalItems" (click)="nextPage()">
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </div>
  </div>

  <!-- 連絡先リスト -->
  <div class="contact-list">
    <div
      class="contact-row"
      *ngFor="let contact of filteredContacts"
      (click)="onContactClick(contact)">
      <!-- 選択チェックボックス -->
      <label class="checkbox-label contact-row__checkbox" (click)="$event.stopPropagation()">
        <input type="checkbox" [(ngModel)]="contact.selected" />
        <span class="checkbox-custom"></span>
      </label>

      <!-- アバター -->
      <div class="contact-row__avatar" [style.background]="contact.avatarColor">
        <span class="contact-row__initial">{{ getAvatarInitial(contact.name) }}</span>
      </div>

      <!-- 情報 -->
      <div class="contact-row__info">
        <div class="contact-row__name-line">
          <span class="contact-row__name">{{ contact.name }}</span>
          <span class="contact-row__furigana">{{ contact.furigana }}</span>
        </div>
        <div class="contact-row__details">
          <span class="contact-row__email">{{ contact.email }}</span>
          <button class="copy-btn" (click)="copyEmail($event, contact.email)" title="メールアドレスをコピー">
            <mat-icon>content_copy</mat-icon>
          </button>
        </div>
        <div class="contact-row__meta">
          <span class="contact-row__company">{{ contact.company }}</span>
          <span class="contact-row__separator">|</span>
          <span class="contact-row__date">登録日: {{ contact.registeredDate }}</span>
        </div>
      </div>

      <!-- 矢印 -->
      <mat-icon class="contact-row__arrow">chevron_right</mat-icon>
    </div>
  </div>
</div>
