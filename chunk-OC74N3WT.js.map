<div class="appeal-detail">
  <a class="appeal-detail__back" (click)="onBack()">
    &lt; アピール一覧に戻る
  </a>

  <div class="appeal-detail__top-bar">
    <div class="appeal-detail__author">
      <app-avatar [name]="appeal.authorName" [imageUrl]="appeal.authorAvatar" [size]="40"></app-avatar>
      <div class="appeal-detail__author-info">
        <span class="appeal-detail__author-name">{{ appeal.authorName }}</span>
        <span class="appeal-detail__date">{{ appeal.createdAt | relativeTime }}</span>
      </div>
    </div>
    <div class="appeal-detail__cta">
      <button
        class="appeal-detail__interested-btn"
        [disabled]="!isMember"
        (click)="onInterested()"
      >
        <mat-icon>favorite</mat-icon>
        興味あり・話を聞きたい
      </button>
      <span class="appeal-detail__cta-hint" *ngIf="!isMember">参加するとメッセージを送れます</span>
    </div>
  </div>

  <h2 class="appeal-detail__title">{{ appeal.title }}</h2>

  <!-- Main visual -->
  <div class="appeal-detail__hero" *ngIf="mainImage">
    <img [src]="mainImage" [alt]="appeal.title" />
  </div>

  <!-- Sub images carousel -->
  <div class="appeal-detail__gallery" *ngIf="subImages.length > 0">
    <div class="appeal-detail__gallery-track" [style.transform]="'translateX(-' + galleryOffset + 'px)'">
      <div class="appeal-detail__gallery-item" *ngFor="let img of subImages; let i = index" (click)="onGalleryClick(i)">
        <img [src]="img" [alt]="appeal.title + ' ' + (i+2)" />
      </div>
    </div>
    <button class="appeal-detail__gallery-prev" *ngIf="galleryOffset > 0" (click)="galleryPrev()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button class="appeal-detail__gallery-next" *ngIf="canGalleryNext" (click)="galleryNext()">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <!-- Lightbox -->
  <div class="appeal-detail__lightbox" *ngIf="lightboxImage" (click)="closeLightbox()">
    <img [src]="lightboxImage" />
    <button class="appeal-detail__lightbox-close"><mat-icon>close</mat-icon></button>
  </div>

  <div class="appeal-detail__section">
    <h3 class="appeal-detail__section-title">自己紹介</h3>
    <p class="appeal-detail__section-text">{{ appeal.selfIntro }}</p>
  </div>

  <div class="appeal-detail__section">
    <h3 class="appeal-detail__section-title">スキル・専門領域</h3>
    <div class="appeal-detail__skills">
      <span class="appeal-detail__skill" *ngFor="let skill of appeal.skills">
        {{ skill }}
      </span>
    </div>
  </div>

  <div class="appeal-detail__section">
    <h3 class="appeal-detail__section-title">こんな人と出会いたい</h3>
    <p class="appeal-detail__section-text">{{ appeal.wantToMeet }}</p>
  </div>
</div>
