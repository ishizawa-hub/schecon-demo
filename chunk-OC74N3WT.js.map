<!-- ニュース詳細ビュー -->
<app-news-detail
  *ngIf="selectedNewsId"
  [newsId]="selectedNewsId"
  [isMember]="isMember"
  (back)="onBackToList()"
></app-news-detail>

<!-- ニュース一覧 -->
<div class="news-list" *ngIf="!selectedNewsId">
  <div class="news-list__header">
    <div class="news-list__search">
      <mat-icon>search</mat-icon>
      <input
        type="text"
        placeholder="ニュースを検索..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="applyFilter()"
      />
    </div>
  </div>

  <div class="news-list__info">
    {{ filteredNews.length }}件のニュース
  </div>

  <!-- Upper Pager -->
  <div class="news-list__pager" *ngIf="totalPages > 1">
    <button class="news-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button
      *ngFor="let p of pageNumbers"
      class="news-list__pager-num"
      [class.news-list__pager-num--active]="p === currentPage"
      (click)="goToPage(p)"
    >{{ p }}</button>
    <button class="news-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <div class="news-list__empty" *ngIf="pagedNews.length === 0">
    <mat-icon>newspaper</mat-icon>
    <p>ニュースはまだありません</p>
  </div>

  <div class="news-list__items">
    <div
      *ngFor="let item of pagedNews"
      class="news-list__card"
      (click)="openArticle(item)"
    >
      <!-- Card visual area -->
      <div class="news-list__card-visual" *ngIf="item.imageUrl">
        <img [src]="item.imageUrl" [alt]="item.title" />
      </div>
      <div class="news-list__card-visual news-list__card-visual--placeholder" *ngIf="!item.imageUrl">
        <mat-icon>article</mat-icon>
      </div>
      <div class="news-list__card-inner">
        <h3 class="news-list__card-title">{{ item.title }}</h3>
        <p class="news-list__card-summary">{{ item.summary }}</p>
        <div class="news-list__card-meta">
          <span class="news-list__card-source">{{ item.source }}</span>
          <span class="news-list__card-date">{{ formatDate(item.publishedAt) }}</span>
          <span class="news-list__card-category">{{ item.category }}</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Lower Pager -->
  <div class="news-list__pager" *ngIf="totalPages > 1">
    <button class="news-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button
      *ngFor="let p of pageNumbers"
      class="news-list__pager-num"
      [class.news-list__pager-num--active]="p === currentPage"
      (click)="goToPage(p)"
    >{{ p }}</button>
    <button class="news-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>
</div>
