<div class="recruitment-detail">
  <a class="recruitment-detail__back" (click)="onBack()">
    &lt; 募集一覧に戻る
  </a>

  <div class="recruitment-detail__top-bar">
    <div class="recruitment-detail__author">
      <app-avatar [name]="recruitment.authorName" [imageUrl]="recruitment.authorAvatar" [size]="40"></app-avatar>
      <div class="recruitment-detail__author-info">
        <span class="recruitment-detail__author-name">{{ recruitment.authorName }}</span>
        <span class="recruitment-detail__date">{{ recruitment.createdAt | relativeTime }}</span>
      </div>
    </div>
    <div class="recruitment-detail__cta">
      <button
        class="recruitment-detail__apply-btn"
        [disabled]="!isMember"
        (click)="onApply()"
      >
        <mat-icon>send</mat-icon>
        応募する
      </button>
      <span class="recruitment-detail__cta-hint" *ngIf="!isMember">参加すると応募できます</span>
    </div>
  </div>

  <h2 class="recruitment-detail__title">{{ recruitment.title }}</h2>

  <!-- Main visual -->
  <div class="recruitment-detail__hero" *ngIf="mainImage">
    <img [src]="mainImage" [alt]="recruitment.title" />
  </div>

  <!-- Sub images carousel -->
  <div class="recruitment-detail__gallery" *ngIf="subImages.length > 0">
    <div class="recruitment-detail__gallery-track" [style.transform]="'translateX(-' + galleryOffset + 'px)'">
      <div class="recruitment-detail__gallery-item" *ngFor="let img of subImages; let i = index" (click)="onGalleryClick(i)">
        <img [src]="img" [alt]="recruitment.title + ' ' + (i+2)" />
      </div>
    </div>
    <button class="recruitment-detail__gallery-prev" *ngIf="galleryOffset > 0" (click)="galleryPrev()">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button class="recruitment-detail__gallery-next" *ngIf="canGalleryNext" (click)="galleryNext()">
      <mat-icon>chevron_right</mat-icon>
    </button>
  </div>

  <!-- Lightbox -->
  <div class="recruitment-detail__lightbox" *ngIf="lightboxImage" (click)="closeLightbox()">
    <img [src]="lightboxImage" />
    <button class="recruitment-detail__lightbox-close"><mat-icon>close</mat-icon></button>
  </div>

  <div class="recruitment-detail__section">
    <h3 class="recruitment-detail__section-title">課題・背景</h3>
    <p class="recruitment-detail__section-text">{{ recruitment.problem }}</p>
  </div>

  <div class="recruitment-detail__section">
    <h3 class="recruitment-detail__section-title">詳細</h3>
    <p class="recruitment-detail__section-text">{{ recruitment.details }}</p>
  </div>

  <!-- 修正 #6: メタ情報が無い時は枠ごと非表示にして空赤枠/空グレー枠が
       残らないようにする -->
  <div class="recruitment-detail__meta" *ngIf="recruitment.deadline || recruitment.hasCompensation">
    <div class="recruitment-detail__meta-item" *ngIf="recruitment.deadline">
      <span class="recruitment-detail__meta-label">締切</span>
      <span class="recruitment-detail__meta-value">{{ recruitment.deadline | relativeTime }}</span>
    </div>
    <div class="recruitment-detail__meta-item" *ngIf="recruitment.hasCompensation">
      <span class="recruitment-detail__meta-label">報酬</span>
      <span class="recruitment-detail__meta-value">{{ recruitment.compensationDetails || '報酬あり（要相談）' }}</span>
    </div>
  </div>
</div>
