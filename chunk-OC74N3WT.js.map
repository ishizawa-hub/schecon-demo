<div class="community-card" [class.community-card--not-joined]="!isMember" (click)="onCardClick()">
  <div class="community-card__image">
    <img [src]="community.imageUrl" [alt]="community.title" />
    <span class="community-card__status community-card__status--joined" *ngIf="isMember">
      <mat-icon>check_circle</mat-icon> 参加中
    </span>
    <span class="community-card__status community-card__status--not-joined" *ngIf="!isMember">
      未参加
    </span>
  </div>

  <div class="community-card__body">
    <div class="community-card__category" *ngIf="categoryIcons[community.category] as cat">
      <mat-icon>{{ cat.icon }}</mat-icon>
      <span>{{ cat.label }}</span>
    </div>
    <h3 class="community-card__title">{{ community.title }}</h3>
    <p class="community-card__description">{{ community.description | truncate:80 }}</p>

    <div class="community-card__tags">
      <span class="community-card__tag" *ngFor="let tag of community.tags">
        {{ tag }}
      </span>
    </div>

    <div class="community-card__footer">
      <div class="community-card__avatars">
        <app-avatar
          *ngFor="let member of memberAvatars"
          [name]="member.name"
          [imageUrl]="member.avatar"
          [size]="28"
        ></app-avatar>
      </div>
      <span class="community-card__member-count">
        <mat-icon>people</mat-icon>
        {{ community.memberCount }}人のメンバー
      </span>
    </div>
  </div>
</div>
