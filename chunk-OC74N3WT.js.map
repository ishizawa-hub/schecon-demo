<div class="blur-overlay">
  <div class="blur-overlay__content" [class.blur-overlay__content--blurred]="blurred && !dismissed">
    <ng-content></ng-content>
  </div>

  <div class="blur-overlay__overlay" *ngIf="blurred && !dismissed">
    <div class="blur-overlay__prompt">
      <button class="blur-overlay__close" (click)="onDismiss()" aria-label="閉じる">
        <mat-icon>close</mat-icon>
      </button>
      <mat-icon class="blur-overlay__lock-icon">lock</mat-icon>
      <h3 class="blur-overlay__title">このコミュニティの全コンテンツを見るには参加が必要です</h3>
      <p class="blur-overlay__subtitle">メンバーへのチャット・募集への応募・アピールの閲覧が可能になります</p>
      <div class="blur-overlay__actions">
        <button class="blur-overlay__button" (click)="onJoinClick()">
          参加申請する
        </button>
        <button class="blur-overlay__skip" (click)="onDismiss()">
          閲覧を続ける
        </button>
      </div>
    </div>
  </div>
</div>
