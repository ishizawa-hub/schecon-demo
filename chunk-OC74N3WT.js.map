<app-blur-overlay [blurred]="!isMember" (joinRequest)="onJoinRequest()">
  <div class="member-list">
    <div class="member-list__header">
      <input
        class="member-list__search"
        type="text"
        placeholder="名前・会社名・役職で検索..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="applyFilter()"
      />
    </div>

    <div class="member-list__info">
      {{ filteredMembers.length }}人のメンバー
    </div>

    <!-- Upper Pager -->
    <div class="member-list__pager" *ngIf="totalPages > 1">
      <button class="member-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        *ngFor="let p of pageNumbers"
        class="member-list__pager-num"
        [class.member-list__pager-num--active]="p === currentPage"
        (click)="goToPage(p)"
      >{{ p }}</button>
      <button class="member-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>

    <div class="member-list__items">
      <div
        class="member-list__item"
        *ngFor="let member of pagedMembers"
        (click)="onMemberClick(member)"
      >
        <div class="member-list__item-info">
          <app-avatar [name]="member.name" [imageUrl]="member.avatar" [size]="40"></app-avatar>
          <div class="member-list__item-text">
            <span class="member-list__item-name">{{ member.name }}</span>
            <span class="member-list__item-detail">{{ member.company }} / {{ member.jobTitle }}</span>
          </div>
        </div>
        <button
          class="member-list__chat-btn"
          [disabled]="!isMember"
          (click)="onChat(member); $event.stopPropagation()"
        >
          チャット
        </button>
      </div>
    </div>

    <p class="member-list__empty" *ngIf="pagedMembers.length === 0">
      メンバーはまだいません
    </p>

    <!-- Lower Pager -->
    <div class="member-list__pager" *ngIf="totalPages > 1">
      <button class="member-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        *ngFor="let p of pageNumbers"
        class="member-list__pager-num"
        [class.member-list__pager-num--active]="p === currentPage"
        (click)="goToPage(p)"
      >{{ p }}</button>
      <button class="member-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>
  </div>
</app-blur-overlay>

<app-member-profile
  *ngIf="selectedMember"
  [member]="selectedMember"
  [isMember]="isMember"
  (close)="onCloseProfile()"
  (chatRequest)="onChat($event)"
></app-member-profile>
