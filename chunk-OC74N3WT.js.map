<div class="community-list">
  <!-- 検索バー + 作成ボタン: スクロール時はブラウザ上部に固定
       (ユーザー指示 2026-04-21) -->
  <div class="community-list__header community-list__sticky">
    <input
      class="community-list__search"
      type="text"
      placeholder="コミュニティを検索..."
      (input)="onSearch($event)"
    />
    <button class="community-list__create-btn" (click)="onCreateCommunity()">
      コミュニティを作成
    </button>
  </div>

  <!-- 件数とページネーションを同じ行に配置 (ユーザー指示 2026-04-21)。
       スクロール時はヘッダー直下に sticky 固定 -->
  <div class="community-list__info community-list__info--inline community-list__sticky community-list__sticky--pager">
    <span class="community-list__info-count">{{ allCommunities.length }}件のコミュニティ</span>
    <div class="community-list__pager community-list__pager--inline" *ngIf="totalPages > 1">
      <button class="community-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(1)" aria-label="最初のページ">
        <mat-icon>first_page</mat-icon>
      </button>
      <button class="community-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)" aria-label="前のページ">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        *ngFor="let p of pageNumbers"
        class="community-list__pager-num"
        [class.community-list__pager-num--active]="p === currentPage"
        (click)="goToPage(p)"
      >{{ p }}</button>
      <button class="community-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)" aria-label="次のページ">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button class="community-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(totalPages)" aria-label="最後のページ">
        <mat-icon>last_page</mat-icon>
      </button>
    </div>
  </div>

  <div class="community-list__grid">
    <app-community-card
      *ngFor="let community of pagedCommunities"
      [community]="community"
      [memberAvatars]="(getMemberPreviews(community.id) | async) || []"
      [isMember]="membershipMap.get(community.id) ?? false"
      (select)="onSelectCommunity($event)"
    ></app-community-card>
  </div>

  <!-- 下部ページャー -->
  <div class="community-list__pager" *ngIf="totalPages > 1">
    <button class="community-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(1)">
      <mat-icon>first_page</mat-icon>
    </button>
    <button class="community-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button
      *ngFor="let p of pageNumbers"
      class="community-list__pager-num"
      [class.community-list__pager-num--active]="p === currentPage"
      (click)="goToPage(p)"
    >{{ p }}</button>
    <button class="community-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
      <mat-icon>chevron_right</mat-icon>
    </button>
    <button class="community-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(totalPages)">
      <mat-icon>last_page</mat-icon>
    </button>
  </div>
</div>
