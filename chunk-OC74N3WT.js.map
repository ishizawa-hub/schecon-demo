<app-blur-overlay [blurred]="!isMember" (joinRequest)="onJoinRequest()">
  <div class="appeal-list">
    <!-- Detail View -->
    <ng-container *ngIf="selectedAppeal; else listView">
      <app-appeal-detail
        [appeal]="selectedAppeal"
        [isMember]="isMember"
        (back)="onBackToList()"
        (interested)="onInterested($event)"
      ></app-appeal-detail>
    </ng-container>

    <!-- List View -->
    <ng-template #listView>
      <div class="appeal-list__header">
        <input
          class="appeal-list__search"
          type="text"
          placeholder="アピールを検索..."
          [(ngModel)]="searchTerm"
          (ngModelChange)="applyFilter()"
        />
        <button
          *ngIf="isMember"
          class="appeal-list__create-btn"
          (click)="onCreate()"
        >
          新規アピールを作成
        </button>
      </div>

      <div class="appeal-list__info">
        {{ filteredAppeals.length }}件のアピール
      </div>

      <!-- Upper Pager -->
      <div class="appeal-list__pager" *ngIf="totalPages > 1">
        <button
          class="appeal-list__pager-btn"
          [disabled]="currentPage === 1"
          (click)="goToPage(currentPage - 1)"
        >
          <mat-icon>chevron_left</mat-icon>
        </button>
        <button
          *ngFor="let p of pageNumbers"
          class="appeal-list__pager-num"
          [class.appeal-list__pager-num--active]="p === currentPage"
          (click)="goToPage(p)"
        >
          {{ p }}
        </button>
        <button
          class="appeal-list__pager-btn"
          [disabled]="currentPage === totalPages"
          (click)="goToPage(currentPage + 1)"
        >
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>

      <div class="appeal-list__items">
        <div
          class="appeal-list__card"
          *ngFor="let appeal of pagedAppeals"
          (click)="onSelectAppeal(appeal)"
        >
          <!-- Owner actions (ユーザー指示 2026-04-21) -->
          <div class="appeal-list__card-actions" *ngIf="isMine(appeal)">
            <button class="appeal-list__card-action-btn" (click)="onEdit(appeal, $event)" title="編集">
              <mat-icon>edit</mat-icon>
            </button>
            <button class="appeal-list__card-action-btn appeal-list__card-action-btn--danger" (click)="onDelete(appeal, $event)" title="削除">
              <mat-icon>delete</mat-icon>
            </button>
          </div>

          <div class="appeal-list__card-visual" *ngIf="(appeal.imageUrls && appeal.imageUrls.length > 0) || appeal.imageUrl">
            <img [src]="(appeal.imageUrls && appeal.imageUrls.length > 0) ? appeal.imageUrls[0] : appeal.imageUrl!" [alt]="appeal.title" />
            <span class="appeal-list__card-img-count" *ngIf="appeal.imageUrls && appeal.imageUrls.length > 1">
              <mat-icon>photo_library</mat-icon>
              {{ appeal.imageUrls.length }}
            </span>
          </div>
          <div class="appeal-list__card-visual appeal-list__card-visual--placeholder" *ngIf="!(appeal.imageUrls && appeal.imageUrls.length > 0) && !appeal.imageUrl">
            <mat-icon>person_outline</mat-icon>
          </div>

          <div class="appeal-list__card-inner">
            <h4 class="appeal-list__card-title">{{ appeal.title }}</h4>
            <p class="appeal-list__card-intro">{{ appeal.selfIntro | truncate:100 }}</p>
            <div class="appeal-list__card-skills" *ngIf="appeal.skills?.length">
              <span class="appeal-list__card-skill" *ngFor="let skill of appeal.skills | slice:0:4">{{ skill }}</span>
            </div>
            <div class="appeal-list__card-footer">
              <div class="appeal-list__card-author-row">
                <app-avatar [name]="appeal.authorName" [imageUrl]="appeal.authorAvatar" [size]="28"></app-avatar>
                <div class="appeal-list__card-author-info">
                  <span class="appeal-list__card-author-name">{{ appeal.authorName }}</span>
                  <span class="appeal-list__card-author-role" *ngIf="appeal.authorCompany || appeal.authorJobTitle">
                    {{ appeal.authorJobTitle }}<span *ngIf="appeal.authorCompany && appeal.authorJobTitle"> / </span>{{ appeal.authorCompany }}
                  </span>
                </div>
              </div>
            </div>
          </div>
        </div>

        <p class="appeal-list__empty" *ngIf="pagedAppeals.length === 0">
          アピールはまだありません
        </p>
      </div>

      <!-- Lower Pager -->
      <div class="appeal-list__pager" *ngIf="totalPages > 1">
        <button
          class="appeal-list__pager-btn"
          [disabled]="currentPage === 1"
          (click)="goToPage(currentPage - 1)"
        >
          <mat-icon>chevron_left</mat-icon>
        </button>
        <button
          *ngFor="let p of pageNumbers"
          class="appeal-list__pager-num"
          [class.appeal-list__pager-num--active]="p === currentPage"
          (click)="goToPage(p)"
        >
          {{ p }}
        </button>
        <button
          class="appeal-list__pager-btn"
          [disabled]="currentPage === totalPages"
          (click)="goToPage(currentPage + 1)"
        >
          <mat-icon>chevron_right</mat-icon>
        </button>
      </div>
    </ng-template>
  </div>
</app-blur-overlay>
