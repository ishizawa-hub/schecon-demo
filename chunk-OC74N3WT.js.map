<div class="member-profile__backdrop" (click)="onClose()">
  <div class="member-profile" (click)="$event.stopPropagation()">
    <button class="member-profile__close" (click)="onClose()">&times;</button>

    <div class="member-profile__header">
      <app-avatar [name]="member.name" [imageUrl]="member.avatar" [size]="80"></app-avatar>
      <h3 class="member-profile__name">{{ member.name }}</h3>
      <p class="member-profile__company">{{ member.company }}</p>
      <p class="member-profile__job-title">{{ member.jobTitle }}</p>
    </div>

    <div class="member-profile__meta">
      <span class="member-profile__joined">参加: {{ member.joinedAt | relativeTime }}</span>
    </div>

    <button
      class="member-profile__chat-btn"
      [disabled]="!isMember"
      (click)="onChatRequest()"
    >
      チャットリクエストを送る
    </button>
  </div>
</div>
