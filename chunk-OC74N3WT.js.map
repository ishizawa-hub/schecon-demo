<div class="community-page">
  <app-community-list
    *ngIf="!communityId"
    (selectCommunity)="onSelectCommunity($event)"
    (createCommunity)="onCreateCommunity()">
  </app-community-list>

  <app-community-detail
    *ngIf="communityId"
    [communityId]="communityId"
    (back)="onBackToList()">
  </app-community-detail>
</div>
