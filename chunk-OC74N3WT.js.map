<app-blur-overlay [blurred]="!isMember" (joinRequest)="onJoinRequest()">
  <!-- Detail View -->
  <app-recruitment-detail
    *ngIf="selectedRecruitment"
    [recruitment]="selectedRecruitment"
    [isMember]="isMember"
    (back)="onBackToList()"
    (apply)="onApply($event)"
  ></app-recruitment-detail>

  <!-- List View -->
  <div class="recruitment-list" *ngIf="!selectedRecruitment">
    <div class="recruitment-list__header">
      <input
        class="recruitment-list__search"
        type="text"
        placeholder="募集を検索..."
        [(ngModel)]="searchTerm"
        (ngModelChange)="applyFilter()"
      />
      <button
        *ngIf="isMember"
        class="recruitment-list__create-btn"
        (click)="onCreate()"
      >
        新規募集を作成
      </button>
    </div>

    <div class="recruitment-list__info">
      {{ filteredRecruitments.length }} 件の募集
    </div>

    <!-- Upper Pager -->
    <div class="recruitment-list__pager" *ngIf="totalPages > 1">
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(1)">
        <mat-icon>first_page</mat-icon>
      </button>
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        *ngFor="let p of pageNumbers"
        class="recruitment-list__pager-num"
        [class.recruitment-list__pager-num--active]="p === currentPage"
        (click)="goToPage(p)"
      >
        {{ p }}
      </button>
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(totalPages)">
        <mat-icon>last_page</mat-icon>
      </button>
    </div>

    <div class="recruitment-list__items">
      <div
        class="recruitment-list__card"
        *ngFor="let rec of pagedRecruitments"
        (click)="onSelect(rec)"
      >
        <!-- Owner actions (ユーザー指示 2026-04-21): 自分が作成した投稿のみ編集/削除 -->
        <div class="recruitment-list__card-actions" *ngIf="isMine(rec)">
          <button class="recruitment-list__card-action-btn" (click)="onEdit(rec, $event)" title="編集">
            <mat-icon>edit</mat-icon>
          </button>
          <button class="recruitment-list__card-action-btn recruitment-list__card-action-btn--danger" (click)="onDelete(rec, $event)" title="削除">
            <mat-icon>delete</mat-icon>
          </button>
        </div>

        <!-- Card image area -->
        <div class="recruitment-list__card-visual" *ngIf="(rec.imageUrls && rec.imageUrls.length > 0) || rec.imageUrl">
          <img [src]="(rec.imageUrls && rec.imageUrls.length > 0) ? rec.imageUrls[0] : rec.imageUrl!" [alt]="rec.title" />
          <span class="recruitment-list__card-badge recruitment-list__card-badge--compensation" *ngIf="rec.hasCompensation">報酬あり</span>
          <span class="recruitment-list__card-img-count" *ngIf="rec.imageUrls && rec.imageUrls.length > 1">
            <mat-icon>photo_library</mat-icon>
            {{ rec.imageUrls.length }}
          </span>
        </div>
        <div class="recruitment-list__card-visual recruitment-list__card-visual--placeholder" *ngIf="!(rec.imageUrls && rec.imageUrls.length > 0) && !rec.imageUrl">
          <mat-icon>work_outline</mat-icon>
          <span class="recruitment-list__card-badge recruitment-list__card-badge--compensation" *ngIf="rec.hasCompensation">報酬あり</span>
        </div>

        <div class="recruitment-list__card-inner">
          <h4 class="recruitment-list__card-title">{{ rec.title }}</h4>
          <p class="recruitment-list__card-problem">{{ rec.problem | truncate:120 }}</p>

          <div class="recruitment-list__card-footer">
            <div class="recruitment-list__card-author-row">
              <app-avatar [name]="rec.authorName" [imageUrl]="rec.authorAvatar" [size]="28"></app-avatar>
              <div class="recruitment-list__card-author-info">
                <span class="recruitment-list__card-author-name">{{ rec.authorName }}</span>
                <span class="recruitment-list__card-author-role" *ngIf="rec.authorCompany || rec.authorJobTitle">
                  {{ rec.authorJobTitle }}<span *ngIf="rec.authorCompany && rec.authorJobTitle"> / </span>{{ rec.authorCompany }}
                </span>
              </div>
            </div>
            <span *ngIf="rec.deadline" class="recruitment-list__card-deadline">
              <mat-icon>schedule</mat-icon> {{ rec.deadline | relativeTime }}
            </span>
          </div>
        </div>
      </div>

      <p class="recruitment-list__empty" *ngIf="pagedRecruitments.length === 0">
        募集はまだありません
      </p>
    </div>

    <!-- Lower Pager -->
    <div class="recruitment-list__pager" *ngIf="totalPages > 1">
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(1)">
        <mat-icon>first_page</mat-icon>
      </button>
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === 1" (click)="goToPage(currentPage - 1)">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <button
        *ngFor="let p of pageNumbers"
        class="recruitment-list__pager-num"
        [class.recruitment-list__pager-num--active]="p === currentPage"
        (click)="goToPage(p)"
      >
        {{ p }}
      </button>
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(currentPage + 1)">
        <mat-icon>chevron_right</mat-icon>
      </button>
      <button class="recruitment-list__pager-btn" [disabled]="currentPage === totalPages" (click)="goToPage(totalPages)">
        <mat-icon>last_page</mat-icon>
      </button>
    </div>
  </div>
</app-blur-overlay>
