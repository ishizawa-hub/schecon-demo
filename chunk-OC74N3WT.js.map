<div class="chat-request">
  <h2 class="chat-request__title">{{ contextLabel }}</h2>

  <div class="chat-request__context">
    <div class="chat-request__context-item">
      <span class="chat-request__context-label">コミュニティ</span>
      <span class="chat-request__context-value">{{ data.communityName }}</span>
    </div>
    <div class="chat-request__context-item">
      <span class="chat-request__context-label">宛先</span>
      <span class="chat-request__context-value">{{ data.targetName }}</span>
    </div>
    <div class="chat-request__context-item" *ngIf="data.prefilledInfo">
      <span class="chat-request__context-label">関連情報</span>
      <span class="chat-request__context-value">{{ data.prefilledInfo }}</span>
    </div>
  </div>

  <div class="chat-request__field">
    <label class="chat-request__label">メッセージ・理由</label>
    <textarea
      class="chat-request__textarea"
      [(ngModel)]="message"
      placeholder="チャットリクエストの理由やメッセージを入力してください"
      rows="4"
    ></textarea>
  </div>

  <div class="chat-request__actions">
    <button class="chat-request__cancel-btn" (click)="onCancel()">キャンセル</button>
    <button class="chat-request__send-btn" (click)="onSend()">送信</button>
  </div>
</div>
