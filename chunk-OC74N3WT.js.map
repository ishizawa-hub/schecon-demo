<div class="community-detail" *ngIf="community$ | async as community">
  <!-- ユーザー指示 (2026-04-27): 「← コミュニティ名」セットでブラウザー上部固定。
       ←ボタンとコミュニティ名にスペースを設けて読みやすく。 -->
  <header class="community-detail__sticky-header">
    <button class="community-detail__sticky-back" (click)="onBack()" aria-label="コミュニティ一覧へ戻る">
      <mat-icon>arrow_back</mat-icon>
    </button>
    <span class="community-detail__sticky-title">{{ community.title }}</span>
  </header>

  <div class="community-detail__banner">
    <img [src]="community.imageUrl" [alt]="community.title" />
  </div>

  <div class="community-detail__info">
    <div class="community-detail__info-main">
      <div class="community-detail__category" *ngIf="categoryIcons[community.category] as cat">
        <mat-icon>{{ cat.icon }}</mat-icon>
        <span>{{ cat.label }}</span>
      </div>
      <h1 class="community-detail__title">{{ community.title }}</h1>
      <p class="community-detail__description">{{ community.description }}</p>

      <div class="community-detail__meta">
        <div class="community-detail__owner">
          <app-avatar [name]="community.ownerName" [imageUrl]="community.ownerAvatar" [size]="24"></app-avatar>
          <span class="community-detail__owner-name">{{ community.ownerName }}</span>
        </div>
        <span class="community-detail__member-count">
          <mat-icon>people</mat-icon>
          {{ community.memberCount }}人のメンバー
        </span>
      </div>
    </div>

    <div class="community-detail__join" *ngIf="isMember$ | async as isMember; else notMember">
      <span class="community-detail__badge community-detail__badge--member">参加済み</span>
    </div>
    <ng-template #notMember>
      <div class="community-detail__join">
        <button class="community-detail__join-btn" (click)="onJoin()">参加申請</button>
      </div>
    </ng-template>
  </div>

  <!-- サブメニュー: ユーザー指示 (2026-04-27) サブメニューもスクロール時に
       sticky で上部固定 (sticky-header の直下に貼り付き) -->
  <div class="community-detail__tabs-wrapper community-detail__tabs-wrapper--sticky">
    <div class="community-detail__tabs">
      <div class="community-detail__tabs-buttons">
        <button
          *ngFor="let tab of tabs"
          class="community-detail__tab"
          [class.community-detail__tab--active]="activeTab === tab.key"
          (click)="setTab(tab.key)"
        >
          {{ tab.label }}
        </button>
      </div>
    </div>
  </div>

  <div class="community-detail__content">
    <app-member-list
      *ngIf="activeTab === 'members'"
      [communityId]="communityId"
      [isMember]="(isMember$ | async) ?? false"
    ></app-member-list>

    <app-recruitment-list
      *ngIf="activeTab === 'recruitment'"
      [communityId]="communityId"
      [isMember]="(isMember$ | async) ?? false"
    ></app-recruitment-list>

    <app-appeal-list
      *ngIf="activeTab === 'appeals'"
      [communityId]="communityId"
      [isMember]="(isMember$ | async) ?? false"
    ></app-appeal-list>

    <app-thread-list
      *ngIf="activeTab === 'threads'"
      [communityId]="communityId"
      [isMember]="(isMember$ | async) ?? false"
    ></app-thread-list>

    <app-news-list
      *ngIf="activeTab === 'news'"
      [communityId]="communityId"
      [isMember]="(isMember$ | async) ?? false"
    ></app-news-list>

    <app-event-list
      *ngIf="activeTab === 'events'"
      [communityId]="communityId"
      [isMember]="(isMember$ | async) ?? false"
    ></app-event-list>
  </div>
</div>
