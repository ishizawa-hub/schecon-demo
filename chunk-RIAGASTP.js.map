<div class="calendar-header">
  <div class="calendar-header__nav">
    <button mat-icon-button (click)="navigateBack()" aria-label="前へ">
      <mat-icon>chevron_left</mat-icon>
    </button>
    <button mat-icon-button (click)="navigateForward()" aria-label="次へ">
      <mat-icon>chevron_right</mat-icon>
    </button>
    <h2 class="calendar-header__title">{{ dateDisplay }}</h2>
    <button
      mat-stroked-button
      class="calendar-header__today-btn"
      (click)="onTodayClick()"
    >
      今日
    </button>
  </div>

  <div class="calendar-header__tools">
    <!-- カレンダーイベント検索: タイトル + 詳細を対象 (Google Calendar 風 dropdown) -->
    <div class="calendar-header__search-wrap">
      <div class="calendar-header__search">
        <mat-icon class="calendar-header__search-icon">search</mat-icon>
        <input type="text"
               class="calendar-header__search-input"
               placeholder="予定を検索"
               [(ngModel)]="eventSearchQuery"
               (focus)="searchFocused = true"
               (blur)="onSearchBlur()"
               (ngModelChange)="onEventSearchChange()" />
        <button *ngIf="eventSearchQuery"
                class="calendar-header__search-clear"
                type="button"
                (click)="clearEventSearch()">
          <mat-icon>close</mat-icon>
        </button>
      </div>
      <!-- Google Calendar 風の検索結果ドロップダウン -->
      <div class="calendar-header__search-results"
           *ngIf="searchFocused && eventSearchQuery.trim() && searchResults.length">
        <button class="calendar-header__search-item"
                *ngFor="let r of searchResults.slice(0, 10)"
                type="mousedown"
                (mousedown)="onSearchResultClick(r, $event)">
          <span class="calendar-header__search-dot" [style.background]="r._color"></span>
          <div class="calendar-header__search-body">
            <div class="calendar-header__search-title">{{ r.title }}</div>
            <div class="calendar-header__search-meta">
              {{ r._dateLabel }}<span *ngIf="r.location"> ・ {{ r.location }}</span>
            </div>
          </div>
        </button>
      </div>
      <div class="calendar-header__search-empty"
           *ngIf="searchFocused && eventSearchQuery.trim() && !searchResults.length">
        該当する予定がありません
      </div>
    </div>

    <mat-button-toggle-group
      class="calendar-header__view-toggle"
      [value]="currentView"
      (change)="onViewChange($event.value)"
      hideSingleSelectionIndicator
    >
      <mat-button-toggle value="month">月</mat-button-toggle>
      <mat-button-toggle value="week7">7日</mat-button-toggle>
      <mat-button-toggle value="week5">5日</mat-button-toggle>
      <mat-button-toggle value="day3">3日</mat-button-toggle>
      <mat-button-toggle value="day1">1日</mat-button-toggle>
    </mat-button-toggle-group>
  </div>
</div>
