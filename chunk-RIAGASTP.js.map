<!-- STEP 8 / Phase 2.2: KeyboardManager の keyboardHeight で SP キーボード時の dialog 高さを補正 -->
<div class="event-editor" [style.--keyboard-h.px]="keyboardHeight" [style.padding-bottom.px]="keyboardHeight">
  <!-- Title -->
  <div class="event-editor__title-row">
    <input
      class="event-editor__title-input"
      type="text"
      placeholder="タイトルを追加"
      [(ngModel)]="title"
      autofocus
    />
  </div>

  <div class="event-editor__body">
    <!-- Date/Time -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">schedule</mat-icon>
      <div class="event-editor__datetime">
        <!-- 日付行 (ユーザー指示 2026-04-21: 日付と時間は別の行にレイアウト) -->
        <div class="event-editor__date-row">
          <mat-form-field appearance="outline" class="event-editor__date-field">
            <input
              matInput
              [matDatepicker]="startPicker"
              [(ngModel)]="startDate"
              (ngModelChange)="onStartDateChange()"
              placeholder="開始日"
            />
            <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
            <mat-datepicker #startPicker></mat-datepicker>
          </mat-form-field>

          <mat-form-field appearance="outline" class="event-editor__date-field" *ngIf="allDay">
            <input
              matInput
              [matDatepicker]="endPicker"
              [(ngModel)]="endDate"
              placeholder="終了日"
            />
            <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
            <mat-datepicker #endPicker></mat-datepicker>
          </mat-form-field>
        </div>

        <!-- 時間行 (開始/終了を同じ行にプルダウンで) -->
        <div class="event-editor__time-row" *ngIf="!allDay">
          <mat-form-field appearance="outline" class="event-editor__time-field">
            <mat-label>開始時間</mat-label>
            <mat-select [(ngModel)]="startTime">
              <mat-option *ngFor="let t of timeOptions" [value]="t.label">
                {{ t.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>

          <span class="event-editor__separator">〜</span>

          <mat-form-field appearance="outline" class="event-editor__time-field">
            <mat-label>終了時間</mat-label>
            <mat-select [(ngModel)]="endTime">
              <mat-option *ngFor="let t of timeOptions" [value]="t.label">
                {{ t.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div class="event-editor__options-row">
          <mat-checkbox [(ngModel)]="allDay" class="event-editor__allday-check">
            終日
          </mat-checkbox>

          <mat-form-field appearance="outline" class="event-editor__recurrence-field">
            <mat-select [(ngModel)]="recurrenceType">
              <mat-option *ngFor="let opt of recurrenceOptions" [value]="opt.value">
                {{ opt.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
        </div>
      </div>
    </div>

    <!-- Location -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">location_on</mat-icon>
      <mat-form-field appearance="outline" class="event-editor__full-field">
        <input matInput placeholder="場所を追加" [(ngModel)]="location" />
      </mat-form-field>
    </div>

    <!-- Video conference -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">videocam</mat-icon>
      <div class="event-editor__video-section">
        <button
          *ngIf="!videoConferenceUrl"
          class="event-editor__video-btn"
          (click)="addVideoConference()"
          type="button"
        >
          <mat-icon>video_call</mat-icon>
          Google Meet会議を追加
        </button>
        <div *ngIf="videoConferenceUrl" class="event-editor__video-link">
          <a [href]="videoConferenceUrl" target="_blank" rel="noopener">
            {{ videoConferenceUrl }}
          </a>
          <button
            mat-icon-button
            (click)="videoConferenceUrl = ''"
            matTooltip="削除"
            type="button"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
      </div>
    </div>

    <!-- Guests -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">people</mat-icon>
      <div class="event-editor__full-field">
        <app-guest-picker
          [guests]="guests"
          (guestsChange)="onGuestsChange($event)"
        ></app-guest-picker>
      </div>
    </div>

    <!-- Availability panel -->
    <div class="event-editor__section" *ngIf="guests.length > 0">
      <mat-icon class="event-editor__section-icon">event_available</mat-icon>
      <div class="event-editor__availability">
        <span class="event-editor__availability-label">空き状況</span>
        <div class="event-editor__availability-bar">
          <div
            class="event-editor__availability-slot"
            *ngFor="let hour of availabilityHours()"
            [style.background-color]="getAvailabilityColor(hour)"
            [matTooltip]="hour + ':00'"
          ></div>
        </div>
        <div class="event-editor__availability-legend">
          <span class="event-editor__legend-item">
            <span class="event-editor__legend-dot" style="background: #4caf50"></span> 空き
          </span>
          <span class="event-editor__legend-item">
            <span class="event-editor__legend-dot" style="background: #f44336"></span> 予定あり
          </span>
        </div>
      </div>
    </div>

    <!-- Reminders -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">notifications</mat-icon>
      <div class="event-editor__reminders">
        <div
          class="event-editor__reminder-row"
          *ngFor="let reminder of reminders; let i = index"
        >
          <mat-form-field appearance="outline" class="event-editor__reminder-field">
            <mat-select [(ngModel)]="reminder.minutes">
              <mat-option *ngFor="let opt of reminderOptions" [value]="opt.value">
                {{ opt.label }}
              </mat-option>
            </mat-select>
          </mat-form-field>
          <button
            mat-icon-button
            (click)="removeReminder(i)"
            matTooltip="削除"
            type="button"
            class="event-editor__reminder-remove"
          >
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <button
          class="event-editor__add-reminder"
          (click)="addReminder()"
          type="button"
        >
          通知を追加
        </button>
      </div>
    </div>

    <!-- Calendar select + visibility -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">calendar_today</mat-icon>
      <div class="event-editor__calendar-row">
        <mat-form-field appearance="outline" class="event-editor__calendar-field">
          <mat-select [(ngModel)]="calendarId">
            <mat-option *ngFor="let cal of calendars" [value]="cal.id">
              <span
                class="event-editor__cal-dot"
                [style.background-color]="cal.color"
              ></span>
              {{ cal.name }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <mat-form-field appearance="outline" class="event-editor__visibility-field">
          <mat-select [(ngModel)]="visibility">
            <mat-option *ngFor="let opt of visibilityOptions" [value]="opt.value">
              {{ opt.label }}
            </mat-option>
          </mat-select>
        </mat-form-field>
      </div>
    </div>

    <!-- Color picker -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">palette</mat-icon>
      <div class="event-editor__colors">
        <button
          class="event-editor__color-btn"
          *ngFor="let c of calendarColors"
          [style.background-color]="c"
          [class.event-editor__color-btn--selected]="color === c"
          (click)="selectColor(c)"
          type="button"
        ></button>
      </div>
    </div>

    <!-- Description -->
    <div class="event-editor__section">
      <mat-icon class="event-editor__section-icon">notes</mat-icon>
      <mat-form-field appearance="outline" class="event-editor__full-field">
        <textarea
          matInput
          placeholder="説明を追加"
          [(ngModel)]="description"
          rows="3"
        ></textarea>
      </mat-form-field>
    </div>

  </div>

  <!-- Footer -->
  <div class="event-editor__footer">
    <button
      *ngIf="mode === 'edit'"
      class="event-editor__delete-btn"
      (click)="onDelete()"
      type="button"
    >
      削除
    </button>
    <div class="event-editor__footer-right">
      <button
        class="event-editor__cancel-btn"
        (click)="onCancel()"
        type="button"
      >
        キャンセル
      </button>
      <button
        class="event-editor__save-btn"
        (click)="onSave()"
        type="button"
      >
        保存
      </button>
    </div>
  </div>
</div>
