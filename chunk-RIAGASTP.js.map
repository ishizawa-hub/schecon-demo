<div class="month-view">
  <!-- Weekday headers -->
  <div class="month-view__header">
    <div
      class="month-view__weekday"
      *ngFor="let label of weekDayLabels; let i = index"
      [class.month-view__weekday--weekend]="i >= 5"
    >
      {{ label }}
    </div>
  </div>

  <!-- Week rows -->
  <div
    class="month-view__week"
    *ngFor="let week of weeks; trackBy: trackByWeek"
  >
    <div
      class="month-view__cell"
      *ngFor="let cell of week; trackBy: trackByCell"
      [class.month-view__cell--other-month]="!cell.isCurrentMonth"
      [class.month-view__cell--weekend]="cell.isWeekend"
      (click)="onCellClick(cell, $event)"
    >
      <div class="month-view__day-number" [class.month-view__day-number--today]="cell.isToday">
        {{ cell.dayNumber }}
      </div>

      <div class="month-view__events">
        <app-event-chip
          *ngFor="let evt of cell.events; trackBy: trackByEvent"
          [event]="evt"
          [color]="getEventColor(evt)"
          (eventClicked)="onEventClick($event)"
        ></app-event-chip>

        <div
          class="month-view__more"
          *ngIf="cell.hasMore"
          (click)="onMoreClick(cell, $event)"
        >
          +{{ cell.moreCount }}件
        </div>
      </div>
    </div>
  </div>
</div>
