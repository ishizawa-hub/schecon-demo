<aside class="calendar-sidebar">
  <!-- Create Event Button -->
  <button
    class="calendar-sidebar__create-btn"
    (click)="onCreateEvent()"
  >
    <mat-icon>add</mat-icon>
    <span>予定作成</span>
  </button>

  <!-- Mini Calendar -->
  <div class="mini-calendar">
    <div class="mini-calendar__header">
      <button mat-icon-button (click)="prevMonth()" class="mini-calendar__nav-btn">
        <mat-icon>chevron_left</mat-icon>
      </button>
      <span class="mini-calendar__title">{{ miniCalendarTitle }}</span>
      <button mat-icon-button (click)="nextMonth()" class="mini-calendar__nav-btn">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>

    <div class="mini-calendar__grid">
      <!-- Week day labels -->
      <div
        class="mini-calendar__weekday"
        *ngFor="let label of weekDayLabels"
      >
        {{ label }}
      </div>

      <!-- Day cells -->
      <div
        class="mini-calendar__day"
        *ngFor="let day of miniCalendarDays"
        [class.mini-calendar__day--other-month]="!day.isCurrentMonth"
        [class.mini-calendar__day--today]="day.isToday"
        [class.mini-calendar__day--selected]="isSelected(day)"
        [class.mini-calendar__day--has-events]="day.hasEvents"
        (click)="selectDate(day)"
      >
        <span class="mini-calendar__day-number">{{ day.dayNumber }}</span>
        <span class="mini-calendar__day-dot" *ngIf="day.hasEvents && !day.isToday && !isSelected(day)"></span>
      </div>
    </div>
  </div>

  <!-- カレンダー検索バー -->
  <div class="calendar-list__search">
    <mat-icon class="calendar-list__search-icon">search</mat-icon>
    <input type="text"
           class="calendar-list__search-input"
           placeholder="カレンダーを検索"
           [(ngModel)]="calendarSearchQuery" />
    <button *ngIf="calendarSearchQuery" class="calendar-list__search-clear"
            type="button" (click)="calendarSearchQuery = ''">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <!-- My Calendars -->
  <div class="calendar-list" *ngIf="myCalendars.length">
    <h3 class="calendar-list__heading">マイカレンダー</h3>
    <div
      class="calendar-list__item"
      *ngFor="let cal of myCalendars"
      (contextmenu)="onCalendarContextMenu($event, cal.id)"
      matTooltip="右クリックで単独表示"
    >
      <mat-checkbox
        [checked]="cal.visible"
        (change)="onToggleCalendar(cal.id)"
        [style.--mdc-checkbox-selected-checkmark-color]="'#fff'"
        [style.--mdc-checkbox-selected-focus-icon-color]="cal.color"
        [style.--mdc-checkbox-selected-hover-icon-color]="cal.color"
        [style.--mdc-checkbox-selected-icon-color]="cal.color"
        [style.--mdc-checkbox-selected-pressed-icon-color]="cal.color"
      >
        <span class="calendar-list__item-name">{{ cal.name }}</span>
      </mat-checkbox>
    </div>
  </div>

  <!-- Other Calendars -->
  <div class="calendar-list" *ngIf="otherCalendars.length">
    <h3 class="calendar-list__heading">他のカレンダー</h3>
    <div
      class="calendar-list__item"
      *ngFor="let cal of otherCalendars"
      (contextmenu)="onCalendarContextMenu($event, cal.id)"
      matTooltip="右クリックで単独表示"
    >
      <mat-checkbox
        [checked]="cal.visible"
        (change)="onToggleCalendar(cal.id)"
        [style.--mdc-checkbox-selected-checkmark-color]="'#fff'"
        [style.--mdc-checkbox-selected-focus-icon-color]="cal.color"
        [style.--mdc-checkbox-selected-hover-icon-color]="cal.color"
        [style.--mdc-checkbox-selected-icon-color]="cal.color"
        [style.--mdc-checkbox-selected-pressed-icon-color]="cal.color"
      >
        <span class="calendar-list__item-name">{{ cal.name }}</span>
      </mat-checkbox>
    </div>
  </div>

  <!-- 検索結果なし -->
  <div class="calendar-list__empty" *ngIf="calendarSearchQuery && !myCalendars.length && !otherCalendars.length">
    該当するカレンダーがありません
  </div>
</aside>
