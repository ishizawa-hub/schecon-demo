<div class="week-view">
  <!-- Column headers -->
  <div class="week-view__header">
    <div class="week-view__gutter-header"></div>
    <div
      class="week-view__col-header"
      *ngFor="let col of columns; trackBy: trackByColumn"
      [class.week-view__col-header--today]="col.isToday"
    >
      <!-- "1日 (月)" 形式で 1 行表示 -->
      <span
        class="week-view__col-date"
        [class.week-view__col-date--today]="col.isToday"
      >
        <span class="week-view__col-date-num">{{ col.label }}</span>
        <span class="week-view__col-dow">{{ col.dayOfWeek }}</span>
      </span>
    </div>
  </div>

  <!-- All-day row -->
  <div class="week-view__allday-row" *ngIf="hasAllDayEvents">
    <div class="week-view__gutter week-view__gutter--allday">終日</div>
    <div
      class="week-view__allday-cell"
      *ngFor="let col of columns; trackBy: trackByColumn"
      [class.week-view__allday-cell--today]="col.isToday"
    >
      <div
        class="week-view__allday-event"
        *ngFor="let evt of col.allDayEvents"
        [style.background-color]="getEventColor(evt)"
        (click)="onEventClick(evt, $event)"
        [title]="evt.title"
      >
        {{ evt.title }}
      </div>
    </div>
  </div>

  <!-- Time grid -->
  <div class="week-view__body" #timeGrid>
    <div class="week-view__time-grid">
      <!-- Hour rows -->
      <div class="week-view__hours">
        <div
          class="week-view__hour-row"
          *ngFor="let hour of hours; trackBy: trackByHour"
        >
          <div class="week-view__gutter">
            <span class="week-view__hour-label">{{ formatHour(hour) }}</span>
          </div>
          <div
            class="week-view__hour-cells"
          >
            <div
              class="week-view__hour-cell"
              *ngFor="let col of columns; let colIdx = index; trackBy: trackByColumn"
              [class.week-view__hour-cell--today]="col.isToday"
              (mousedown)="onGridMouseDown($event, colIdx)"
            >
              <div
                class="week-view__half-hour week-view__half-hour--top"
                (click)="onTimeSlotClick(col, hour, false, $event)"
              ></div>
              <div
                class="week-view__half-hour week-view__half-hour--bottom"
                (click)="onTimeSlotClick(col, hour, true, $event)"
              ></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Event overlays per column -->
      <div class="week-view__events-overlay">
        <div class="week-view__events-gutter"></div>
        <div
          class="week-view__events-col"
          *ngFor="let col of columns; let colIdx = index; trackBy: trackByColumn"
        >
          <div
            class="week-view__event-block"
            *ngFor="let pe of col.timedEvents; trackBy: trackByEvent"
            [class.week-view__event-block--moving]="isMovingSourceBlock(pe)"
            [style.top.px]="pe.top"
            [style.height.px]="pe.height"
            [style.left.%]="pe.left"
            [style.width.%]="pe.width - 2"
            [style.background-color]="pe.color"
            (mousedown)="onEventMouseDown(pe, colIdx, $event)"
            (click)="onEventClick(pe.event, $event)"
            [title]="pe.event.title"
          >
            <div class="week-view__event-title">{{ pe.event.title }}</div>
            <div class="week-view__event-time" *ngIf="pe.height > 30">
              {{ pe.event.location || '' }}
            </div>
          </div>

          <!-- Drag-to-create preview -->
          <div
            class="week-view__drag-preview"
            *ngIf="dragState.active && dragState.columnIndex === colIdx"
            [style.top.px]="dragPreviewTop"
            [style.height.px]="dragPreviewHeight"
          >
            <span class="week-view__drag-preview-label">{{ dragPreviewTimeLabel }}</span>
          </div>

          <!-- Drag-to-move preview (ユーザー指示 2026-04-21) -->
          <div
            class="week-view__move-preview"
            *ngIf="moveState.active && moveState.currentColumnIndex === colIdx"
            [style.top.px]="movePreviewTop"
            [style.height.px]="movePreviewHeight"
          >
            <span class="week-view__move-preview-label">
              {{ moveState.event?.title }}<br />
              {{ movePreviewTimeLabel }}
            </span>
          </div>
        </div>
      </div>

      <!-- Current time line -->
      <div
        class="week-view__current-time"
        *ngIf="currentTimeVisible"
        [style.top.px]="currentTimeTop"
      >
        <div class="week-view__current-time-gutter"></div>
        <div
          class="week-view__current-time-segment"
          *ngFor="let col of columns; let colIdx = index"
          [class.week-view__current-time-segment--active]="col.isToday"
        >
          <div class="week-view__current-time-dot" *ngIf="col.isToday"></div>
          <div class="week-view__current-time-line" *ngIf="col.isToday"></div>
        </div>
      </div>
    </div>
  </div>
</div>
