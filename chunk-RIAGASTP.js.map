<div class="day-view">
  <!-- Header -->
  <div class="day-view__header">
    <div class="day-view__gutter-header"></div>
    <div
      class="day-view__col-header"
      [class.day-view__col-header--today]="dayIsToday"
    >
      <span class="day-view__col-dow">{{ dayOfWeek }}</span>
      <span
        class="day-view__col-date"
        [class.day-view__col-date--today]="dayIsToday"
      >{{ dayLabel }}</span>
    </div>
  </div>

  <!-- All-day row -->
  <div class="day-view__allday-row" *ngIf="allDayEvents.length > 0">
    <div class="day-view__gutter day-view__gutter--allday">終日</div>
    <div class="day-view__allday-cell" [class.day-view__allday-cell--today]="dayIsToday">
      <div
        class="day-view__allday-event"
        *ngFor="let evt of allDayEvents"
        [style.background-color]="getEventColor(evt)"
        (click)="onEventClick(evt, $event)"
        [title]="evt.title"
      >
        {{ evt.title }}
      </div>
    </div>
  </div>

  <!-- Time grid -->
  <div class="day-view__body" #timeGrid>
    <div class="day-view__time-grid">
      <!-- Hour rows -->
      <div class="day-view__hours">
        <div
          class="day-view__hour-row"
          *ngFor="let hour of hours; trackBy: trackByHour"
        >
          <div class="day-view__gutter">
            <span class="day-view__hour-label">{{ formatHour(hour) }}</span>
          </div>
          <div
            class="day-view__hour-cell"
            [class.day-view__hour-cell--today]="dayIsToday"
          >
            <div
              class="day-view__half-hour day-view__half-hour--top"
              (click)="onTimeSlotClick(hour, false)"
            ></div>
            <div
              class="day-view__half-hour day-view__half-hour--bottom"
              (click)="onTimeSlotClick(hour, true)"
            ></div>
          </div>
        </div>
      </div>

      <!-- Event overlays -->
      <div class="day-view__events-overlay">
        <div class="day-view__events-gutter"></div>
        <div class="day-view__events-col">
          <div
            class="day-view__event-block"
            *ngFor="let pe of timedEvents; trackBy: trackByEvent"
            [style.top.px]="pe.top"
            [style.height.px]="pe.height"
            [style.left.%]="pe.left"
            [style.width.%]="pe.width - 1"
            [style.background-color]="pe.color"
            (click)="onEventClick(pe.event, $event)"
          >
            <div class="day-view__event-title">{{ pe.event.title }}</div>
            <div class="day-view__event-details" *ngIf="pe.height > 40">
              <span class="day-view__event-location" *ngIf="pe.event.location">
                <span class="day-view__event-icon">📍</span> {{ pe.event.location }}
              </span>
            </div>
            <div class="day-view__event-guests" *ngIf="pe.height > 56 && pe.event.guests.length > 0">
              <span
                class="day-view__guest-avatar"
                *ngFor="let initial of getGuestInitials(pe.event)"
              >{{ initial }}</span>
              <span class="day-view__guest-more" *ngIf="pe.event.guests.length > 3">
                +{{ pe.event.guests.length - 3 }}
              </span>
            </div>
          </div>
        </div>
      </div>

      <!-- Current time line -->
      <div
        class="day-view__current-time"
        *ngIf="currentTimeVisible"
        [style.top.px]="currentTimeTop"
      >
        <div class="day-view__current-time-gutter"></div>
        <div class="day-view__current-time-main">
          <div class="day-view__current-time-dot"></div>
          <div class="day-view__current-time-line"></div>
        </div>
      </div>
    </div>
  </div>
</div>
