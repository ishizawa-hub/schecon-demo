<div class="guest-picker">
  <!-- Guest chips -->
  <div class="guest-picker__chips" *ngIf="guests.length > 0">
    <div class="guest-picker__chip" *ngFor="let guest of guests">
      <mat-icon
        class="guest-picker__chip-status"
        [style.color]="getResponseColor(guest.responseStatus)"
      >
        {{ getResponseIcon(guest.responseStatus) }}
      </mat-icon>
      <span class="guest-picker__chip-name">{{ guest.displayName }}</span>
      <span class="guest-picker__chip-email">{{ guest.email }}</span>
      <button
        class="guest-picker__chip-remove"
        (click)="removeGuest(guest)"
        type="button"
      >
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </div>

  <!-- Search input -->
  <div class="guest-picker__input-wrapper">
    <mat-icon class="guest-picker__search-icon">person_add</mat-icon>
    <input
      class="guest-picker__input"
      type="text"
      placeholder="ゲストを追加（名前またはメールアドレス）"
      [(ngModel)]="searchQuery"
      (input)="onSearchInput()"
      (keydown.enter)="addGuestByEmail()"
      [matAutocomplete]="auto"
    />
    <mat-autocomplete
      #auto="matAutocomplete"
      (optionSelected)="addGuest($event.option.value)"
    >
      <mat-option
        *ngFor="let suggestion of suggestions"
        [value]="suggestion"
      >
        <div class="guest-picker__suggestion">
          <span class="guest-picker__suggestion-name">{{ suggestion.displayName }}</span>
          <span class="guest-picker__suggestion-email">{{ suggestion.email }}</span>
        </div>
      </mat-option>
    </mat-autocomplete>
  </div>
</div>
