<div
  class="event-chip"
  [class.event-chip--all-day]="event.allDay"
  [style.--chip-color]="color"
  (click)="onClick($event)"
  [title]="event.title"
>
  <span class="event-chip__bar"></span>
  <span class="event-chip__time" *ngIf="!event.allDay">{{ timeLabel }}</span>
  <span class="event-chip__title">{{ event.title }}</span>
</div>
