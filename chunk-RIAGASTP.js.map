<div
  class="calendar-page"
  [class.calendar-page--sidebar-collapsed]="sidebarCollapsed"
  [class.calendar-page--mobile]="isMobile"
>
  <!-- Sidebar -->
  <app-calendar-sidebar
    *ngIf="!sidebarCollapsed"
    class="calendar-page__sidebar"
    [calendars]="calendars"
    [currentDate]="currentDate"
    [eventsMap]="eventsDateMap"
    (dateSelected)="onDateSelected($event)"
    (createEventClicked)="onCreateEventClicked()"
    (calendarVisibilityToggled)="onCalendarVisibilityToggled($event)"
    (calendarSoloToggled)="onCalendarSoloToggled($event)"
    (monthChanged)="onMonthChanged($event)"
  ></app-calendar-sidebar>

  <!-- Main area -->
  <div class="calendar-page__main">
    <!-- Header -->
    <app-calendar-header
      [currentDate]="currentDate"
      [currentView]="currentView"
      [searchResults]="searchResultsForHeader"
      (dateChanged)="onDateChanged($event)"
      (viewChanged)="onViewChanged($event)"
      (todayClicked)="onTodayClicked()"
      (eventSearch)="onEventSearch($event)"
      (eventSelected)="onSearchEventSelected($event)"
    ></app-calendar-header>

    <!-- View area -->
    <div class="calendar-page__view">
      <!-- Month view -->
      <app-calendar-month-view
        *ngIf="currentView === 'month'"
        [currentDate]="currentDate"
        [events]="events"
        [visibleCalendarIds]="visibleCalendarIds"
        [calendars]="calendars"
        (dateClicked)="onDateClicked($event)"
        (eventClicked)="onEventClicked($event)"
        (moreEventsClicked)="onMoreEventsClicked($event)"
      ></app-calendar-month-view>

      <!-- Week views (7-day, 5-day, 3-day) -->
      <app-calendar-week-view
        *ngIf="currentView === 'week7' || currentView === 'week5' || currentView === 'day3'"
        [currentDate]="currentDate"
        [events]="events"
        [visibleCalendarIds]="visibleCalendarIds"
        [calendars]="calendars"
        [viewType]="weekViewType"
        (eventClicked)="onEventClicked($event)"
        (timeSlotClicked)="onTimeSlotClicked($event)"
        (timeSlotDragged)="onTimeSlotDragged($event)"
        (eventMoved)="onEventMoved($event)"
      ></app-calendar-week-view>

      <!-- Day view -->
      <app-calendar-day-view
        *ngIf="currentView === 'day1'"
        [currentDate]="currentDate"
        [events]="events"
        [visibleCalendarIds]="visibleCalendarIds"
        [calendars]="calendars"
        (eventClicked)="onEventClicked($event)"
        (timeSlotClicked)="onTimeSlotClicked($event)"
      ></app-calendar-day-view>
    </div>
  </div>

  <!-- Event detail popover -->
  <div
    class="calendar-page__detail-overlay"
    *ngIf="showEventDetail && selectedEvent"
    (click)="onOverlayClick()"
  >
    <div class="calendar-page__detail-container" (click)="$event.stopPropagation()">
      <app-event-detail
        [event]="selectedEvent"
        [calendar]="selectedEventCalendar"
        (editClicked)="onEventDetailEdit($event)"
        (deleteClicked)="onEventDetailDelete($event)"
        (duplicateClicked)="onEventDetailDuplicate($event)"
        (guestsInvited)="onEventDetailInvite($event)"
        (responseChanged)="onEventDetailResponse($event)"
        (closed)="closeEventDetail()"
      ></app-event-detail>
    </div>
  </div>

  <!-- Mobile FAB -->
  <button
    class="calendar-page__fab"
    *ngIf="isMobile"
    (click)="onMobileFab()"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>
