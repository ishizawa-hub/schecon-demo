<div class="image-upload">
  <!-- Drop Zone (shown when no image selected) -->
  <div
    *ngIf="!previewUrl"
    class="image-upload__dropzone"
    [class.image-upload__dropzone--dragging]="isDragging"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="fileInput.click()"
  >
    <mat-icon class="image-upload__icon">cloud_upload</mat-icon>
    <p class="image-upload__text">クリックまたはドラッグ&ドロップで画像を追加</p>
  </div>

  <!-- Info Text -->
  <p *ngIf="!previewUrl" class="image-upload__info">
    推奨サイズ: {{ recommendedSize }} / 対応形式: JPG, PNG, GIF, WebP / 最大{{ maxFileSizeMB }}MB
  </p>

  <!-- Error Message -->
  <p *ngIf="error" class="image-upload__error">{{ error }}</p>

  <!-- Preview Section -->
  <div
    *ngIf="previewUrl"
    class="image-upload__preview"
    #previewContainer
    (mousemove)="onCropMove($event, previewContainer)"
  >
    <img
      class="image-upload__preview-image"
      [src]="previewUrl"
      [alt]="fileName || '選択した画像'"
    />

    <!-- Remove Button -->
    <button
      class="image-upload__remove"
      type="button"
      (click)="removeImage()"
      aria-label="画像を削除"
    >
      <mat-icon>close</mat-icon>
    </button>

    <!-- Portrait Crop Overlay -->
    <div *ngIf="isPortrait" class="image-upload__crop-overlay">
      <div
        class="image-upload__crop-top"
        [style.height.%]="cropTop"
      ></div>
      <div class="image-upload__crop-guide">
        <span class="image-upload__crop-label">縦長画像: 表示範囲をドラッグで調整</span>
      </div>
      <div
        class="image-upload__crop-bottom"
        [style.height.%]="100 - cropTop - 56.25"
      ></div>
    </div>
  </div>

  <!-- File Name -->
  <p *ngIf="fileName" class="image-upload__filename">{{ fileName }}</p>

  <!-- Hidden File Input -->
  <input
    #fileInput
    type="file"
    class="image-upload__input"
    accept="image/jpeg,image/png,image/gif,image/webp"
    (change)="onFileSelect($event)"
  />
</div>
